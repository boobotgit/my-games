<title>Northman Saga</title>

<style>
:root{--wood:#1d1915;--wood2:#28221c;--line:#4a3f33;--parch:#efe4c8;--parch2:#e2d3ad;--ink:#2a2118;--ink2:#5e4d3a;--red:#9b3520;--gold:#d4a73a;--sea:#22384a;--ok:#3f6b2e;--bad:#9b2a1a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--wood);color:#eadcc0;font-family:'EB Garamond',Georgia,serif;overflow:hidden;font-size:16px}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
header{display:flex;align-items:center;gap:14px;padding:5px 12px;background:linear-gradient(#2e271f,#1b1612);border-bottom:2px solid var(--line);flex-wrap:wrap;min-height:44px}
header h1{font-family:Cinzel,serif;font-size:19px;margin:0;color:var(--gold);letter-spacing:2px;white-space:nowrap}
#date{font-family:Cinzel,serif;font-size:14px;color:#f3e6c6;min-width:210px}
#date small{display:block;color:#b9a682;font-family:'EB Garamond',serif;font-size:13px}
.res{display:flex;gap:12px;font-size:15px;flex-wrap:wrap}
.res span{white-space:nowrap}.res b{color:#fff4da}
.res .neg{color:#ff8a6a}
.grow{flex:1}
.speed button{min-width:34px;padding:3px 6px}
.speed button.on{background:#a8792c;color:#1b130b}
main{display:grid;grid-template-columns:1fr 350px;min-height:0}
#mapwrap{position:relative;min-width:0;min-height:0;background:#1a2a36}
#map{width:100%;height:100%;display:block;cursor:grab}
#maphint{position:absolute;left:10px;bottom:8px;font-size:13px;color:#d9ccb0;background:#000a;padding:3px 8px;border-radius:4px;pointer-events:none}
img.portrait{float:left;border-radius:4px;border:1px solid #6a5636;margin:0 8px 2px 0;background:#2a2018}img.portrait.pr{width:54px;height:63px}img.portrait.sm{width:38px;height:44px}img.portrait.xs{width:22px;height:26px;margin:-3px 5px 0 0;vertical-align:middle;float:none}img.portrait.big{width:84px;height:98px;float:none;margin-right:6px}.kinrow{display:flex;gap:4px;margin:4px 0}.evpic{margin:6px 0}
#maplegend{position:absolute;left:10px;top:8px;font-size:12.5px;color:#e9dcc0;background:#000a;padding:3px 8px;border-radius:4px;pointer-events:none;max-width:calc(100% - 20px)}#maplegend .lk{color:#cdbb92}
.townpic{display:block;width:100%;height:auto;border-radius:4px;margin:-2px 0 6px;border:1px solid #8a7550}
.tstats{display:grid;grid-template-columns:1fr 1fr;gap:1px 10px;font-size:13px;margin:2px 0 4px}.tstats b{color:var(--ink)}
#pausedTag{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-family:Cinzel;color:#ffe2a0;background:#000a;padding:2px 12px;border-radius:4px;pointer-events:none;display:none}
aside{background:var(--wood2);border-left:2px solid var(--line);overflow-y:auto;padding:10px}
.card{background:var(--parch);color:var(--ink);border-radius:6px;padding:9px 12px;margin-bottom:10px;box-shadow:0 2px 0 #0007;border:1px solid #b9a273}
.card h3{font-family:Cinzel,serif;margin:0 0 5px;font-size:15px;color:var(--red);letter-spacing:.5px}
.card h4{margin:6px 0 2px;font-size:14px;color:var(--ink2)}
.card p{margin:4px 0}
.small{font-size:13.5px;color:var(--ink2)}
.muted{color:#8a7a62}
button{font-family:inherit;font-size:15px;background:#5b3a22;color:#fbefd5;border:1px solid #2b1a0e;border-radius:4px;padding:3px 10px;cursor:pointer;margin:2px 1px}
button:hover{background:#7a4c2b}
button:disabled{opacity:.4;cursor:default;background:#5b3a22}
button.alt{background:#34505f}button.alt:hover{background:#41657a}
button.red{background:#8e2c18}button.red:hover{background:#ab3a22}
button.gold{background:#a8792c;color:#1d140b}button.gold:hover{background:#c38f37}
button.sm{font-size:13px;padding:1px 6px}
button.big{font-size:17px;padding:6px 16px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:6px}
.bar{height:7px;background:#c9b88e;border-radius:4px;overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.goal{margin:2px 0;font-size:14px}.goal.done{color:var(--ok)}.goal.done::before{content:'✔ '}.goal:not(.done)::before{content:'◇ ';color:#a08a60}
.fleetrow{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;border-radius:4px;cursor:pointer;border:1px solid transparent}
.fleetrow:hover{background:#e6d7b2}.fleetrow.sel{border-color:var(--red);background:#ecdcb4}
footer#log{height:150px;overflow-y:auto;background:linear-gradient(#211a13,#16120d);border-top:3px solid var(--gold);font-size:15.5px;padding:0 14px 6px;line-height:1.4;cursor:pointer}
footer#log::before{content:'📜 Chronicle · click to read it all';position:sticky;top:0;display:block;background:#211a13;font-family:Cinzel,serif;font-size:13px;letter-spacing:1px;color:var(--gold);padding:5px 0 3px;border-bottom:1px solid var(--line);margin-bottom:3px;z-index:1}
#log div:last-child{background:#3a2d1c;border-left:3px solid var(--gold);padding-left:6px;color:#fff4da}
#log.flash{animation:logflash 2.4s ease-out}
@keyframes logflash{0%{box-shadow:inset 0 0 0 3px #ffd36a,0 -6px 24px #d4a73a88}100%{box-shadow:none}}
.chronlist{max-height:60vh;overflow-y:auto;font-size:15px;line-height:1.4;background:#00000014;padding:6px 10px;border-radius:4px}
.chronlist div{margin:2px 0}.chronlist .d,.newscard .d{color:#7a6346;margin-right:6px}
.chronlist .hist,.newscard .hist{color:#7a5a10;font-weight:600}.chronlist .war,.newscard .war{color:#8e2a16}.chronlist .good,.newscard .good{color:#2f5a1e}
.counsel{border-color:var(--gold)}.counsel p{margin:3px 0}
.newscard{display:none}
#mapwrap,#side,header{user-select:none;-webkit-user-select:none}
#log div{margin:1px 0}#log .d{color:#a89470;margin-right:6px}
#log .hist{color:#e9c46a}#log .war{color:#ff9a7a}#log .good{color:#b6dc8c}
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50}
#modal.hidden,#battle.hidden,#title.hidden{display:none}
.box{background:var(--parch);color:var(--ink);width:min(920px,95vw);max-height:92vh;overflow:auto;border-radius:8px;padding:16px 22px;border:3px solid #6b4a2b;box-shadow:0 10px 50px #000;position:relative}
.box h2{font-family:Cinzel,serif;color:var(--red);margin:0 0 8px;font-size:22px}
.box h3{font-family:Cinzel,serif;color:var(--ink2);margin:12px 0 6px;font-size:16px}
.box .x{position:absolute;right:10px;top:8px}
.tabs{display:flex;gap:4px;border-bottom:2px solid #b49a68;margin:6px 0 10px;flex-wrap:wrap}

.tabs button.on{background:#5b3a22;color:#fbefd5}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{text-align:left;font-weight:600;color:var(--ink2);border-bottom:1px solid #b49a68;padding:3px 5px}
table.t td{border-bottom:1px solid #d8c69c;padding:3px 5px;vertical-align:middle}
.pill{display:inline-block;padding:0 7px;border-radius:9px;font-size:13px;background:#d9c597;margin:1px}
.pill.ok{background:#bcd7a0}.pill.bad{background:#e7a991}
.story{font-style:italic;color:#4b3a28;border-left:3px solid #b49a68;padding:2px 10px;margin:8px 0}
.choice{display:block;width:100%;text-align:left;margin:5px 0;padding:7px 12px;font-size:15.5px}
.choice small{display:block;opacity:.8;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bld{background:#e9dbb8;border:1px solid #c4ab78;border-radius:6px;padding:8px}
.bld h4{margin:0 0 3px;font-family:Cinzel;font-size:14px;color:var(--red)}
.lv{color:var(--ink2);font-size:13px}
.stepper{display:inline-flex;align-items:center;gap:2px}
.stepper b{min-width:34px;text-align:center;display:inline-block}
#toasts{position:fixed;right:364px;top:56px;z-index:70;display:flex;flex-direction:column;gap:6px;max-width:360px}
.toast{background:#2b231b;border:1px solid #8a6a3a;color:#f3e4c2;padding:7px 12px;border-radius:6px;box-shadow:0 4px 14px #000a;font-size:14.5px;cursor:pointer}
/* battle */
#battle{position:fixed;inset:0;background:#0f0d0b;z-index:60;display:grid;grid-template-rows:auto 1fr auto}
.bbar{background:#221c16;border-bottom:2px solid var(--line);padding:6px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:#eadcc0}
#bbot{border-top:2px solid var(--line);border-bottom:none;min-height:74px}
#bwrap{position:relative;min-height:0}
#bcv{width:100%;height:100%;display:block}
.sq{background:#3a2e24;border:2px solid #5a4632;border-radius:5px;padding:3px 8px;cursor:pointer;font-size:13.5px;min-width:96px}
.sq.sel{border-color:#ffd36a;background:#4d3b2a}
.sq.rout{opacity:.5}
.sq .bar{background:#5a4a3a;height:5px}.sq .bar i{background:#d8b45a}
#bmsg{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#000b;color:#ffe9b0;padding:4px 14px;border-radius:4px;font-family:Cinzel;pointer-events:none}
/* title */
#title{position:fixed;inset:0;z-index:80;background:radial-gradient(ellipse at 50% 30%,#2c3b46 0%,#151b20 60%,#0c0f12 100%);overflow:auto;color:#eadcc0}
#title .inner{max-width:980px;margin:0 auto;padding:30px 20px}
#title h1{font-family:Cinzel;font-size:54px;color:var(--gold);margin:10px 0 0;letter-spacing:6px;text-align:center;text-shadow:0 3px 12px #000}
#title .sub{text-align:center;font-style:italic;color:#c9b993;margin-bottom:22px;font-size:18px}
.sagas{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.saga{background:#e9dcb9;color:var(--ink);border-radius:8px;padding:12px;border:2px solid #8b6a3c;position:relative}
.saga h3{font-family:Cinzel;margin:0;color:var(--red);font-size:16px}
.saga .yrs{font-size:13px;color:var(--ink2)}
.saga.locked{opacity:.62;filter:saturate(.5)}
.saga.locked::after{content:'Coming in a later build';position:absolute;right:8px;top:8px;font-size:11px;background:#5b3a22;color:#fbefd5;padding:1px 6px;border-radius:8px}
.homes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.home{background:#f1e6ca;color:var(--ink);border:2px solid #b39a68;border-radius:8px;padding:10px;cursor:pointer}
.home.on{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.home h4{margin:0;font-family:Cinzel;color:var(--red)}
input[type=text]{font-family:inherit;font-size:16px;padding:4px 8px;border:1px solid #8b6a3c;border-radius:4px;background:#fffaf0}
.rune{letter-spacing:3px;color:#8b6a3c;text-align:center;font-size:18px}
@media (max-width:1000px){main{grid-template-columns:1fr 290px}.sagas,.homes{grid-template-columns:1fr 1fr}#toasts{right:300px}}
.homeBtn{display:inline-block;text-decoration:none;font-family:inherit;font-size:15px;background:#5b3a22;color:#fbefd5;border:1px solid #2b1a0e;border-radius:4px;padding:3px 10px}
.titleHome{position:absolute;left:14px;top:12px}

/* ================= phone & tablet layout ================= */
:root{--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);--safeL:env(safe-area-inset-left,0px);--safeR:env(safe-area-inset-right,0px)}
html{-webkit-text-size-adjust:100%}
html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text;font-size:16px}
body{position:fixed;inset:0}
#app{height:100%;padding-left:var(--safeL);padding-right:var(--safeR)}
header{gap:4px 8px;padding:4px 8px;padding-top:calc(4px + var(--safeT))}
header h1{display:none}
#date{min-width:0;font-size:12.5px;flex:1 1 auto}
#date small{display:inline;margin-left:5px;font-size:11.5px}
.res{gap:9px;font-size:13px;order:5;flex:1 1 100%;justify-content:space-between}
.grow{display:none}
.speed{order:1;margin-left:auto;display:flex}
.speed button{min-width:32px;padding:4px 6px;font-size:13px}
header>.row{order:3;flex:1 1 100%;flex-wrap:nowrap;gap:4px}
header>.row button{flex:1 1 auto;padding:5px 4px!important}
header .row button{padding:5px 8px;font-size:13.5px}
.homeBtn.narrow{padding:4px 9px;font-size:16px}
main{grid-template-columns:1fr;grid-template-rows:1fr clamp(170px,34%,300px)}
#map{touch-action:none}
aside{border-left:none;border-top:2px solid var(--line);padding:8px}
footer#log{height:calc(76px + var(--safeB));padding:0 10px var(--safeB);font-size:13px}
footer#log::before{content:'📜 Chronicle · tap to read it all';font-size:11px;padding:3px 0 2px}
#toasts{left:calc(8px + var(--safeL));right:calc(8px + var(--safeR));top:calc(var(--safeT) + 84px);max-width:none}
.toast{font-size:13.5px}
#maphint{font-size:11.5px;right:8px;left:8px;bottom:6px;text-align:center}
#maphint{transition:opacity 1s}#maphint.gone{opacity:0}
#maplegend{font-size:10.5px;left:calc(6px + var(--safeL));top:6px;padding:2px 6px;max-width:calc(100% - 12px)}
#modal{align-items:stretch}
.box{width:100%;max-height:none;height:100%;border-radius:0;border:none;padding:calc(10px + var(--safeT)) calc(12px + var(--safeR)) calc(18px + var(--safeB)) calc(12px + var(--safeL))}
.box h2{font-size:20px;padding-right:46px}
.box .x{top:calc(6px + var(--safeT));right:calc(8px + var(--safeR));font-size:18px;padding:4px 13px}
.grid2,.grid3{grid-template-columns:1fr}
button{padding:6px 11px}
button.sm{padding:5px 9px;font-size:13.5px}
.choice{padding:10px 12px}
table.t{font-size:14px}
table.t td{padding:5px 4px}
.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;padding:6px 11px}
.bbar{gap:6px;padding:4px 8px;font-size:13px}
#btop{padding-top:calc(4px + var(--safeT));padding-left:calc(8px + var(--safeL));padding-right:calc(8px + var(--safeR))}
#btop button{padding:5px 8px;font-size:13px}
#bbot{flex-wrap:nowrap;overflow-x:auto;min-height:0;padding-bottom:calc(6px + var(--safeB));padding-left:calc(8px + var(--safeL));padding-right:calc(8px + var(--safeR))}
#bbot>div{flex:0 0 auto}
#bbot button{padding:7px 10px}
#bcv{touch-action:none}
#bmsg{font-size:13px;max-width:90%;text-align:center}
#title .inner{padding:calc(16px + var(--safeT)) calc(14px + var(--safeR)) calc(24px + var(--safeB)) calc(14px + var(--safeL))}
#title h1{font-size:34px;letter-spacing:3px;margin-top:26px}
#title .sub{font-size:15px}
.titleHome{left:calc(12px + var(--safeL));top:calc(10px + var(--safeT))}
.sagas,.homes{grid-template-columns:1fr}
.home{padding:12px}

@media (orientation:portrait){#bwrap::after{content:'Turn your phone sideways for a bigger battlefield';position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:12px;color:#b9a682;pointer-events:none}}

@media (min-width:700px) and (min-height:700px){ /* iPad */
  main{grid-template-rows:1fr clamp(220px,32%,340px)}
  .grid3{grid-template-columns:1fr 1fr 1fr}.grid2{grid-template-columns:1fr 1fr}

  @media (orientation:landscape){main{grid-template-columns:1fr 340px;grid-template-rows:1fr}aside{border-top:none;border-left:2px solid var(--line)}}
}
</style></head>
<body>
<div id="app">
<header>
 <a class="homeBtn narrow" href="index.html" title="Back to BooBot Arcade">⌂</a>
 <h1>Northman Saga</h1>
 <div id="date"></div>
 <div class="res" id="res"></div>
 <div class="grow"></div>
 <div class="speed" id="speed"><button data-act="pause" title="Pause (Space)">❚❚</button><button data-act="speed" data-arg="1" title="Normal (1)">▶</button><button data-act="speed" data-arg="2" title="Fast (2)">▶▶</button><button data-act="speed" data-arg="4" title="Fastest (3)">▶▶▶</button></div>
 <div class="row"><button data-act="hall">Hall</button><button data-act="peoples">Peoples</button><button data-act="saga">Saga</button><button data-act="codex">Codex</button><button data-act="menu" class="alt">Menu</button></div>
</header>
<main><div id="mapwrap"><canvas id="map"></canvas><div id="pausedTag">Paused</div><div id="maplegend"><span class="lk">■</span> market town <b style="color:#ffd36a">◈</b> trade here · <span class="lk">●</span> village or hall · <span class="lk">▲</span> cult site · <span class="lk">⬢</span> hillfort · <span class="lk">?</span> rumour · colour = owner</div><div id="maphint">Drag · pinch to zoom · tap to select · hold on the sea to sail the selected fleet there</div></div><aside id="side"></aside></main>
<footer id="log"></footer>
</div>
<div id="modal" class="hidden"><div class="box" id="mbox"></div></div>
<div id="battle" class="hidden"><div class="bbar" id="btop"></div><div id="bwrap"><canvas id="bcv"></canvas><div id="bmsg"></div></div><div class="bbar" id="bbot"></div></div>
<div id="title"><div class="inner" id="tinner"></div></div>
<div id="toasts"></div>
<script>
'use strict';
/* ================= NORTHMAN SAGA — DATA ================= */
const BUILD='2026-11-22a';
const SAVE_VERSION=1;
const LON0=3,LON1=34,LAT0=53.4,LAT1=65.6;
const KX=111*Math.cos(59.5*Math.PI/180),KY=111;
const WKM=(LON1-LON0)*KX,HKM=(LAT1-LAT0)*KY;
const proj=(lon,lat)=>({x:(lon-LON0)*KX,y:(LAT1-lat)*KY});
const unproj=(x,y)=>({lon:LON0+x/KX,lat:LAT1-y/KY});
const START_YEAR=793;
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

const SETS=[

{id:'soli',name:'Sóli',lon:5.68,lat:58.88,fac:'ind',size:1,kind:'village',prod:['grain','fish'],note:'Farms on Jæren\'s flat plain beside Hafrsfjord, some of the best grain land in western Norway.'},

{id:'borgund',name:'Borgund',lon:6.3,lat:62.42,fac:'ind',size:1,kind:'village',prod:['fish','soap'],note:'A trading landing in Sunnmøre that later became one of the few medieval towns of the northwest.'},
{id:'nordmore',name:'Tingvoll',lon:8.0,lat:62.95,fac:'lade',size:1,kind:'village',prod:['fish','iron'],note:'The thing-place of Nordmøre, where free farmers met to make law and settle feuds.'},
{id:'lade',name:'Hlaðir',lon:10.45,lat:63.38,fac:'lade',size:3,kind:'seat',prod:['grain','fur'],note:'Lade on the Trondheimsfjord, seat of the jarls of Lade. Their line ruled Trøndelag almost as its own kingdom for two centuries.'},
{id:'maere',name:'Mære',lon:11.45,lat:63.75,fac:'lade',size:1,kind:'sacred',prod:['grain'],note:'A great cult site of the Trønders. Gold-foil figures found beneath the later church show offerings were made here.'},
{id:'halog',name:'Hålogaland',lon:12.6,lat:65.4,fac:'ind',size:1,kind:'market',prod:['fur','ivory','fish'],note:'The far north. Chieftains here took furs, feathers, walrus ivory and hide ropes as tribute from the Sámi and traded them south. Ohthere of Hålogaland later described this trade to King Alfred.'},
{id:'lista',name:'Lista',lon:6.85,lat:58.15,fac:'ind',size:1,kind:'village',prod:['grain','fish'],note:'A flat, windswept farm district near Norway\'s southern tip, where ships made landfall from Jutland.'},
{id:'agdir',name:'Agðir',lon:8.6,lat:58.45,fac:'ind',size:1,kind:'village',prod:['iron','fish'],note:'Agder, a petty kingdom of the south coast. In saga tradition, Queen Åsa of Agder was carried off by the Vestfold king.'},
{id:'kaupang',name:'Kaupang',lon:10.05,lat:59.07,fac:'ves',size:2,kind:'market',prod:['soap','iron'],note:'Skíringssalr, Norway\'s first town, a market under the Vestfold kings. Soapstone, iron and whetstones went out; glass, pottery and silver came in.'},
{id:'borre',name:'Borre',lon:10.38,lat:59.4,fac:'ves',size:2,kind:'seat',prod:['grain'],note:'Royal burial ground of the Vestfold kings, with great mounds above the Oslofjord.'},
{id:'tuns',name:'Túnsberg',lon:10.32,lat:59.27,fac:'ves',size:1,kind:'village',prod:['grain','fish'],note:'Tønsberg. Nearby, in 834, a high-born woman was buried in the Oseberg ship.'},
{id:'borg',name:'Borg',lon:11.05,lat:59.25,fac:'ind',size:1,kind:'seat',prod:['grain'],note:'A chieftain\'s seat by the falls of the Glomma, in the land called Víkin. That bay may have given the vikings their name.'},
{id:'ranriki',name:'Ranríki',lon:11.65,lat:58.35,fac:'ind',size:1,kind:'village',prod:['fish'],note:'Bohuslän: a rocky coast of islets and skerries, Norwegian ground in this age.'},
{id:'lodose',name:'Lödöse',lon:12.25,lat:57.95,fac:'gaut',size:1,kind:'village',prod:['grain','iron'],note:'On the Göta river, the Gautar\'s gate to the western sea.'},
{id:'ostgot',name:'Östergötland',lon:16.3,lat:58.45,fac:'gaut',size:2,kind:'seat',prod:['grain','iron'],note:'Rich farmland of the eastern Gautar, in the lake country between Vättern and the Baltic.'},
{id:'more',name:'Möre',lon:16.1,lat:56.72,fac:'gaut',size:1,kind:'village',prod:['grain'],note:'A coast facing Öland across the Kalmar sound.'},
{id:'eketorp',name:'Eketorp',lon:16.5,lat:56.35,fac:'gaut',size:1,kind:'fort',prod:['grain'],note:'A round stone fort on Öland. Islanders crowded inside its wall when raiders came.'},
{id:'birka',name:'Birka',lon:17.54,lat:59.33,fac:'svea',size:3,kind:'market',prod:['fur','iron'],note:'An island town in Lake Mälaren and the great market of the Svear. Furs from the north and silver dirhams from the east changed hands here. The monk Ansgar came here in 829.'},
{id:'uppsala',name:'Uppsala',lon:17.64,lat:59.86,fac:'svea',size:3,kind:'sacred',prod:['grain','iron'],note:'Old Uppsala, beneath its royal mounds: the cult centre and seat of the Svea kings.'},
{id:'roden',name:'Roden',lon:18.65,lat:59.85,fac:'ind',size:1,kind:'village',prod:['fish'],note:'The Roslagen coast, whose oarsmen owed ships to the Svea king. The Finns called the Swedes "Ruotsi", perhaps from this rowing coast, and the Slavs would say "Rus".'},
{id:'halsing',name:'Hälsingland',lon:17.0,lat:61.7,fac:'ind',size:1,kind:'village',prod:['fur','fish'],note:'The forested coast of the Hälsingar, rich in furs from the wild interior.'},
{id:'hogom',name:'Högom',lon:17.2,lat:62.42,fac:'ind',size:2,kind:'seat',prod:['fur','iron'],note:'Medelpad. A chieftain buried here around 500 lay with a horse, weapons and fine cloth. Power on the Bothnian coast is old.'},
{id:'angr',name:'Ångermanland',lon:18.2,lat:63.0,fac:'ind',size:1,kind:'village',prod:['fur'],note:'A high coast of deep bays and forest at the edge of the settled north.'},
{id:'paviken',name:'Paviken',lon:18.35,lat:57.55,fac:'gut',size:2,kind:'market',prod:['amber','grain'],note:'A harbour of the Gutar on Gotland. The island has yielded more buried Viking silver than anywhere else in the world.'},
{id:'saltvik',name:'Saltvik',lon:20.05,lat:60.25,fac:'ind',size:1,kind:'fort',prod:['fish'],note:'Åland, the stepping-stone between Sweden and Finland, with its hillfort at Borgboda.'},
{id:'sorte',name:'Sorte Muld',lon:14.95,lat:55.15,fac:'dan',size:1,kind:'village',prod:['grain'],note:'The "black earth" of Bornholm, an old rich centre where thousands of tiny gold-foil figures were found.'},
{id:'lejre',name:'Lejre',lon:11.95,lat:55.6,fac:'dan',size:3,kind:'seat',prod:['grain'],note:'Home of the legendary Skjöldung kings of Denmark. Archaeologists found a great hall here nearly 50 metres long.'},
{id:'tisso',name:'Tissø',lon:11.3,lat:55.58,fac:'dan',size:1,kind:'seat',prod:['grain'],note:'A magnate\'s estate by a lake named for the god Týr, with a hall, a cult house and a seasonal market.'},
{id:'gudme',name:'Gudme',lon:10.65,lat:55.15,fac:'dan',size:2,kind:'seat',prod:['grain','amber'],note:'Funen: "home of the gods", an ancient rich centre with its harbour at Lundeborg.'},
{id:'hedeby',name:'Hedeby',lon:9.45,lat:54.5,fac:'dan',size:3,kind:'market',prod:['salt','wine','swords'],note:'Haithabu, at the head of the Schlei: the Danish king\'s market at the neck of Jutland, where goods crossed overland between the Baltic and the North Sea.'},
{id:'ribe',name:'Ribe',lon:8.85,lat:55.33,fac:'dan',size:2,kind:'market',prod:['wine','salt'],note:'The oldest town in Scandinavia: a North Sea market full of Frisian traders, glass beads and Rhineland wine.'},
{id:'aros',name:'Aros',lon:10.15,lat:56.15,fac:'dan',size:1,kind:'village',prod:['grain','fish'],note:'Aarhus, "river mouth", a young settlement on Jutland\'s east coast.'},
{id:'lindholm',name:'Lindholm',lon:9.9,lat:57.05,fac:'dan',size:1,kind:'village',prod:['grain'],note:'By the Limfjord, a sheltered water-road across North Jutland. Its graves are marked by stones set in the shape of ships.'},
{id:'uppakra',name:'Uppåkra',lon:13.17,lat:55.67,fac:'dan',size:2,kind:'sacred',prod:['grain'],note:'For a thousand years the chief place of Scania, with a cult house rebuilt again and again on the same spot.'},
{id:'ahus',name:'Åhus',lon:14.1,lat:55.93,fac:'dan',size:1,kind:'market',prod:['amber','fish'],note:'A small beach market in Scania where craftsmen made beads and combs for passing traders.'},
{id:'reric',name:'Reric',lon:11.5,lat:53.92,fac:'obo',size:2,kind:'market',prod:['wax','grain'],note:'The market of the Obotrites, Slavic allies of the Franks. Danish kings drew taxes from its trade.'},
{id:'ralswiek',name:'Ralswiek',lon:13.45,lat:54.45,fac:'rani',size:1,kind:'market',prod:['wax','grain'],note:'A trading harbour of the Rani on Rügen, where Scandinavian and Slavic merchants met.'},
{id:'arkona',name:'Arkona',lon:13.4,lat:54.62,fac:'rani',size:2,kind:'sacred',prod:['grain'],note:'The cliff-top stronghold and temple of the Rani, later famous for its four-headed god Svantevit.'},
{id:'wolin',name:'Wolin',lon:14.62,lat:53.85,fac:'pom',size:2,kind:'market',prod:['wax','amber'],note:'A great Slavic port at the mouth of the Oder, later remembered in saga as Jómsborg.'},
{id:'truso',name:'Truso',lon:19.4,lat:54.15,fac:'pru',size:2,kind:'market',prod:['amber','wax'],note:'The market of the Prussians near the Vistula. The traveller Wulfstan sailed here from Hedeby in seven days and nights.'},
{id:'wisk',name:'Wiskiauten',lon:20.45,lat:54.88,fac:'pru',size:1,kind:'village',prod:['amber'],note:'On the Sambian amber coast, where Scandinavian traders lived and were buried among the Prussians.'},

const GW=310,GH=244,GDX=(LON1-LON0)/GW,GDY=(LAT1-LAT0)/GH,NC=GW*GH;

function pip(poly,lon,lat){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];if(((yi>lat)!==(yj>lat))&&(lon<(xj-xi)*(lat-yi)/(yj-yi)+xi))c=!c;}return c;}
function bbox(p){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const[x,y]of p){a=Math.min(a,x);b=Math.min(b,y);c=Math.max(c,x);d=Math.max(d,y);}return[a,b,c,d];}
const cellLon=i=>LON0+(i+.5)*GDX,cellLat=j=>LAT1-(j+.5)*GDY;
function cellAt(x,y){const i=Math.floor(x/CWK),j=Math.floor(y/CHK);if(i<0||j<0||i>=GW||j>=GH)return -1;return j*GW+i;}
function cellCenter(c){return{x:((c%GW)+.5)*CWK,y:(Math.floor(c/GW)+.5)*CHK};}
function buildRaster(){
 const lp=LAND_POLYS.map(p=>({p,b:bbox(p)})),wp=WATER_POLYS.map(p=>({p,b:bbox(p)}));
 for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){const lon=cellLon(i),lat=cellLat(j);let l=0;
  for(const q of lp){if(lon<q.b[0]||lon>q.b[2]||lat<q.b[1]||lat>q.b[3])continue;if(pip(q.p,lon,lat)){l=1;break;}}
  if(l)for(const q of wp){if(lon<q.b[0]||lon>q.b[2]||lat<q.b[1]||lat>q.b[3])continue;if(pip(q.p,lon,lat)){l=0;break;}}
  LAND[j*GW+i]=l;}
 // nav: flood from open sea
 const st=[cellAt(proj(4.5,57.5).x,proj(4.5,57.5).y)];NAV[st[0]]=1;
 while(st.length){const c=st.pop(),i=c%GW,j=(c/GW)|0;for(const[di,dj]of[[1,0],[-1,0],[0,1],[0,-1]]){const ni=i+di,nj=j+dj;if(ni<0||nj<0||ni>=GW||nj>=GH)continue;const n=nj*GW+ni;if(!LAND[n]&&!NAV[n]){NAV[n]=1;st.push(n);}}}

}
function blurField(src,r,passes){let a=new Float32Array(NC);for(let k=0;k<NC;k++)a[k]=src[k];let b=new Float32Array(NC);
 for(let p=0;p<passes;p++){for(let j=0;j<GH;j++){let s=0,n=0;for(let i=-r;i<GW+r;i++){const ia=i+r;if(ia<GW){s+=a[j*GW+ia];n++;}const ir=i-r-1;if(ir>=0){s-=a[j*GW+ir];n--;}if(i>=0&&i<GW)b[j*GW+i]=s/n;}}
  for(let i=0;i<GW;i++){let s=0,n=0;for(let j=-r;j<GH+r;j++){const ja=j+r;if(ja<GH){s+=b[ja*GW+i];n++;}const jr=j-r-1;if(jr>=0){s-=b[jr*GW+i];n--;}if(j>=0&&j<GH)a[j*GW+i]=s/n;}}}
 return a;}
function sampleF(F,x,y){const fx=x/CWK-.5,fy=y/CHK-.5;const i=clamp(Math.floor(fx),0,GW-2),j=clamp(Math.floor(fy),0,GH-2);const u=clamp(fx-i,0,1),v=clamp(fy-j,0,1);
 const a=F[j*GW+i],b=F[j*GW+i+1],c=F[(j+1)*GW+i],d=F[(j+1)*GW+i+1];return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function nearestNav(x,y,maxR=25){const c0=cellAt(clamp(x,0,WKM-1),clamp(y,0,HKM-1));if(c0>=0&&NAV[c0])return c0;
 const i0=c0%GW,j0=(c0/GW)|0;let best=-1,bd=1e9;for(let r=1;r<=maxR;r++){for(let dj=-r;dj<=r;dj++)for(let di=-r;di<=r;di++){if(Math.max(Math.abs(di),Math.abs(dj))!==r)continue;const i=i0+di,j=j0+dj;if(i<0||j<0||i>=GW||j>=GH)continue;const c=j*GW+i;if(!NAV[c])continue;const p=cellCenter(c),d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;best=c;}}if(best>=0&&r>2)break;}return best;}

const AG=new Float32Array(NC),AP=new Int32Array(NC),AS=new Uint32Array(NC),AC=new Uint8Array(NC);let AGEN=1;

 const push=(c,f)=>{H.push(c);HF.push(f);let k=H.length-1;while(k>0){const p=(k-1)>>1;if(HF[p]<=HF[k])break;[H[p],H[k]]=[H[k],H[p]];[HF[p],HF[k]]=[HF[k],HF[p]];k=p;}};

 AS[c0]=AGEN;AG[c0]=0;AP[c0]=-1;AC[c0]=0;push(c0,h(c0));let it=0;
 while(H.length){const c=pop();if(c===c1)break;if(AC[c]&&AS[c]===AGEN)continue;AC[c]=1;if(++it>90000)return null;const i=c%GW,j=(c/GW)|0;

 for(const s of SETS){const g=SG[s.id];if(s.id===home)continue;if(dist(g,hp)<330||['kaupang','hedeby','birka','ribe'].includes(s.id))S.sets[s.id].rumor=true;}
 reveal(hp.x,hp.y,150);

/* ---- numbers ---- */
const popCap=()=>[0,80,140,220][S.bld.hall];
function holdings(){return SETS.filter(s=>s.id!==S.home&&S.sets[s.id].own==='player').map(s=>s.id);}
function rankFor(ren,h){let r=0;RANKS.forEach((R,i)=>{if(ren>=R.ren&&h>=R.hold)r=i;});return r;}
const rank=()=>rankFor(S.renown,holdings().length);
const hirdCap=()=>[0,20,40,70][S.bld.hall]+RANKS[rank()].hird+specHird();
function totalMen(type){let n=type==='bondi'?0:(S[type]||0);for(const f of S.fleets)n+=f.men[type]||0;if(type==='hird')for(const id in S.sets)n+=S.sets[id].gar||0;return n;}
function mouths(){let m=S.pop+S.thralls+S.hird+S.bow+S.berserk;for(const f of S.fleets)m+=fleetMen(f)+(f.captives||0);return m;}
const armsBonus=()=>[0,.08,.16,.25][S.bld.smith]+Math.min(.15,S.swords/Math.max(10,totalMen('hird'))*.15);
function addRenown(n,why){S.renown=Math.max(0,S.renown+n);if(why&&n)log(`${n>0?'+':''}${Math.round(n)} renown: ${why}`,n>0?'good':'war');checkRank();}
function checkRank(){const r=rank();if(r>(S.rankSeen||0)){S.rankSeen=r;queueEvent(()=>evRank(r));}}
function relOf(id){const st=S.sets[id];if(st.own==='player')return 100;if(st.own==='ind')return st.rel;return S.facs[st.own]?S.facs[st.own].rel:0;}
function changeRel(id,d){const st=S.sets[id];if(st.own==='ind')st.rel=clamp(st.rel+d,-100,100);else if(S.facs[st.own])S.facs[st.own].rel=clamp(S.facs[st.own].rel+d,-100,100);}
function relWord(r){return r>=60?'Friends':r>=25?'Friendly':r>-15?'Wary':r>-50?'Hostile':'Blood-feud';}
function facPower(f){let p=0;for(const s of SETS)if(S.sets[s.id].own===f)p+=S.sets[s.id].men;return p;}
function homeDefense(){let d=S.hird+S.berserk*1.6+S.bow*.6+S.pop*.2*.6;for(const f of S.fleets)if(f.at===S.home)d+=fleetPower(f);return d*(1+[0,.3,.6,1][S.bld.wall]);}
function setDefense(id){const st=S.sets[id],s=SET[id];if(id===S.home)return homeDefense();if(st.own==='player')return(st.gar*1.05*(hasSpec(id,'fort')?2:1)+(st.trib?st.men*.8:baseMen(s)*.3))*(1+.3*wallOf(s))*holdDefMult(id);return st.men*.68*(1+.3*wallOf(s));}

/* ---- daily tick ---- */
let lastDay=-1;
function dayTick(){
 const d=doy(),B=S.bld,season=isSailSeason(d);
 let food=0.035*S.pop+(season?[0,3,5,8][B.fish]:0);
 S.res.food+=food-mouths()*.1;S.res.timber+=[0,.8,1.4,2.2][B.wood];S.res.iron+=[.05,.15,.28,.45][B.smith];
 if(season){S.res.silver+=[0,.3,.8][B.market];if(S.home==='avald')S.res.silver+=.4;}
 const up=totalMen('hird')*UPKEEP.hird+totalMen('bow')*UPKEEP.bow+totalMen('berserk')*UPKEEP.berserk;S.res.silver-=up;
 if(S.res.silver<0){S.res.silver=0;S.loyalty-=.6;if(d%15===0)log('Your hird grumbles: there is no silver left for rings and gifts.','war');}
 if(S.res.food<0){S.res.food=0;const lost=rnd()<S.pop*.0025?1:0;S.pop=Math.max(5,S.pop-lost);S.loyalty-=.5;if(d%7===0){log('Hunger stalks your hall. Folk are leaving or dying.','war');toast('Your people are starving! Raid, trade or buy grain.');}}
 else if(S.res.food>mouths()*20&&S.pop<popCap())S.pop+=S.pop*.0004*(1+S.renown/600)+(rnd()<.02?1:0);
 if(S.pop>popCap())S.pop-=(S.pop-popCap())*.01;
 if(S.res.silver>0&&S.res.food>0)S.loyalty+=(58-S.loyalty)*.004;
 S.loyalty=clamp(S.loyalty,0,100);
 if(S.loyalty<20&&d%7===0&&S.hird>0){const n=Math.max(1,Math.round(S.hird*.03));S.hird-=n;log(`${n} hirdmen leave your hall to seek a more open-handed lord.`,'war');}
 if(S.building){S.building.left--;if(S.building.left<=0){const k=S.building.k;S.bld[k]++;log(`The builders finish: ${BLD[k].n} is now level ${S.bld[k]}.`,'good');toast(`${BLD[k].n} raised to level ${S.bld[k]}.`);S.building=null;}}
 if(S.yardJob){S.yardJob.left--;if(S.yardJob.left<=0){const j=S.yardJob;S.ships.push({id:S.nextId++,type:j.type,name:j.name,hp:100,loc:'home'});log(`The shipwrights launch a new ${SHIPS[j.type].n}, the ${j.name}.`,'good');toast(`New ship launched: the ${j.name}.`);S.yardJob=null;}}
 for(const id in S.mk)for(const g in S.mk[id])S.mk[id][g]*=.985;
 // winter sailing
 if(!season)for(const f of S.fleets){if(!f.path||!f.path.length)continue;const gale=has(fleetLeader(f),'seafarer')?.012:.025;for(const sh of fleetShips(f)){if(rnd()<gale){sh.hp-=ri(20,55);if(sh.hp<=0){shipLost(f,sh,'foundered in a winter gale');}else log(`A winter gale batters the ${sh.name}.`,'war');}}}
 // repairs
 for(const sh of S.ships){if(sh.hp<100){const f=sh.loc==='home'?null:fleetById(sh.loc);if(sh.loc==='home'||(f&&(f.at===S.home||(f.at&&S.sets[f.at].own==='player'&&hasSpec(f.at,'sheds')))))sh.hp=Math.min(100,sh.hp+3);}}
 if(d===DOY.harvest)harvest();
 if(d===DOY.midsummer)queueEvent(evThing);
 if(d===DOY.winterNights)queueEvent(evWinterNights);
 if(d===DOY.yule)queueEvent(evYule);
 if(d===0)newYear();
 if(MSTART.includes(d)){monthly();}
 histCheck();
 if(rnd()<1/45)randomEvent();
 if(season&&rnd()<.16&&S.ai.filter(a=>a.kind==='trade').length<7)spawnTrader();
 checkChapter();checkRank();
 sideDirty=true;
}
function shipLost(f,sh,why){const seats=SHIPS[sh.type].seats;const men=fleetMen(f);const lossFrac=Math.min(1,seats/Math.max(1,fleetSeats(f)));
 for(const k in f.men){const l=Math.round(f.men[k]*lossFrac*.7);f.men[k]-=l;}S.ships=S.ships.filter(x=>x!==sh);log(`The ${sh.name} ${why}. Many of her crew drowned.`,'war');toast(`The ${sh.name} ${why}!`);
 if(!fleetShips(f).length){log(`${f.name} is lost.`,'war');S.fleets=S.fleets.filter(x=>x!==f);if(f.chief)rulerDies('drowned at sea');}}
function harvest(){const B=S.bld;const base=[0,900,1600,2400][B.farm],need=[0,60,100,150][B.farm];const workers=S.pop+S.thralls*1.2;const w=Math.min(1.25,workers/need);const weather=S.flags.badHarvest===year()?.55:(.82+rnd()*.36);
 const f=Math.round(base*w*weather);S.res.food+=f;let msg=`Harvest at ${SET[S.home].name}: ${f} food${weather<.7?' (a poor year)':weather>1.08?' (a fine year)':''}.`;
 let hf=0,hs=0,ht=0;for(const id of holdings()){const s=SET[id],st=S.sets[id];const Y=holdYield(id);hf+=Y.food;hs+=Y.silver;ht+=Y.timber;
  for(const g of s.prod){if(GOODS[g].food)continue;S.store[g]=(S.store[g]||0)+Math.round(s.size*(st.trib?1:2));}}
 if(hf){S.res.food+=hf;S.res.silver+=hs;S.res.timber+=ht;msg+=` Your holdings send ${Math.round(hf)} food, ${Math.round(hs)} silver and goods.`;}
 log(msg,'good');toast(msg);}
function monthly(){const d=doy();if(d>=90&&d<260){aiRaidCheck();rivalWarCheck();}captMonthly();for(const f in S.facs){const st=S.facs[f];if(st.rel<0&&!st.griev)st.rel+=1;else if(st.rel>0&&!st.ally)st.rel-=.5;}
 for(const id in S.sets){const st=S.sets[id];if(st.own==='ind'&&st.rel<0)st.rel+=1;}autosave();}
function newYear(){
 // settlements recover
 for(const s of SETS){const st=S.sets[s.id];if(st.own==='player')continue;st.men+=Math.round((baseMen(s)*(String(st.own).startsWith('rv')?1.5:1)-st.men)*.35);st.wealth=Math.min(1,st.wealth+.3);}
 for(const f in S.facs)if(S.facs[f].griev>0&&rnd()<.4)S.facs[f].griev--;
 for(const id of holdings()){const st=S.sets[id];st.wealth=Math.min(1,st.wealth+.15);if(st.trib&&relOf(id)<-60){}}
 // hof renown
 if(S.bld.hof)addRenown([0,10,25][S.bld.hof],'sacrifices at your hof');
 const hofR=holdings().reduce((a,id)=>a+(hasSpec(id,'hof')?4*SET[id].size:0),0);if(hofR)addRenown(hofR,'the hofs of your holdings');
 const mus=holdings().filter(id=>hasSpec(id,'muster')).length;if(mus){const n=Math.min(mus*2,hirdCap()-totalMen('hird'));if(n>0){S.hird+=n;log(`${n} young men from your muster grounds join the hird.`,'good');}}
 captYearly();rivalYearly();
 // family
 const age=ageOf(S.ruler);if(S.spouse&&age<52&&S.kids.length<8&&rnd()<(S.kids.length?.45:.65)){const m=rnd()<.5;const k={name:pick(m?NAMES_M:NAMES_F),born:year(),sex:m?'m':'f'};S.kids.push(k);log(`${S.spouse.name} bears ${rulerName(S.ruler)} a ${m?'son':'daughter'}, ${k.name}.`,'good');}
 for(const k of S.kids.slice()){if(year()-k.born<6&&rnd()<.06){S.kids=S.kids.filter(x=>x!==k);log(`The child ${k.name} sickens and dies.`,'war');}}
 const pd=age<40?.006:age<50?.02:age<60?.05:age<70?.12:.25;if(rnd()<pd)queueEvent(()=>rulerDies('of sickness in the dark of winter'));
 if(age>=30&&!S.spouse&&!S.flags.marryNag){S.flags.marryNag=1;queueEvent(evMarryNag);}
}

/* ================= FLEETS ================= */
const fleetById=id=>S.fleets.find(f=>f.id===id);
const fleetShips=f=>S.ships.filter(s=>s.loc===f.id);
const fleetSeats=f=>fleetShips(f).reduce((a,s)=>a+SHIPS[s.type].seats,0);
const fleetCargoCap=f=>fleetShips(f).reduce((a,s)=>a+SHIPS[s.type].cargo,0);
const fleetMen=f=>(f.men.hird||0)+(f.men.bow||0)+(f.men.bondi||0)+(f.men.berserk||0);
function cargoUsed(f){let n=f.captives||0;for(const g in f.cargo)n+=f.cargo[g];return n;}
function fleetSpeed(f){const sh=fleetShips(f);let v=sh.length?Math.min(...sh.map(s=>SHIPS[s.type].spd)):100;if(S.home==='roden')v*=1.1;if(has(fleetLeader(f),'seafarer'))v*=1.12;if(!isSailSeason(doy()))v*=.75;const dmg=Math.min(...sh.map(s=>s.hp),100);if(dmg<50)v*=.8;return v;}
function fleetPower(f){const e=1+armsBonus();return(f.men.hird||0)*e+(f.men.berserk||0)*1.6+(f.men.bow||0)*.6+(f.men.bondi||0)*.6;}
function warShips(f){return fleetShips(f).filter(s=>SHIPS[s.type].war).length;}
function orderSail(f,id){if(f.state==='battle')return;if(id===f.at){openArrival(f,id);return;}const g=SG[id];const p=findPath(f.x,f.y,g.dock.x,g.dock.y);if(!p){toast(`No sea road leads to ${SET[id].name}.`);return;}
 f.path=p;f.dest={set:id};f.at=null;f.chase=null;const days=pathLen(p,f)/fleetSpeed(f);log(`${f.name} sets sail for ${SET[id].name} (about ${Math.max(1,Math.round(days))} days).`);
 if(!isSailSeason(doy()))toast('Sailing out of season: winter gales may sink your ships.');if(S.paused&&S.settings.autoPauseArrive)setPaused(false);sideDirty=true;}
function orderSailPoint(f,x,y){if(f.state==='battle')return;const p=findPath(f.x,f.y,x,y);if(!p){toast('No sea road leads there.');return;}f.path=p;f.dest=null;f.at=null;f.chase=null;sideDirty=true;if(S.paused)setPaused(false);}
function orderChase(f,aid){const a=S.ai.find(x=>x.id===aid);if(!a)return;f.chase=aid;f.dest=null;f.at=null;f.chaseT=0;const p=findPath(f.x,f.y,a.x,a.y);if(p)f.path=p;log(`${f.name} gives chase.`);sideDirty=true;if(S.paused)setPaused(false);}
function stepAlong(o,dd,spd){let move=spd*dd;while(move>0&&o.path&&o.path.length){const q=o.path[0];const d=Math.hypot(q.x-o.x,q.y-o.y);if(d>.001)o.heading=Math.atan2(q.y-o.y,q.x-o.x);if(d<=move){o.x=q.x;o.y=q.y;o.path.shift();move-=d;}else{o.x+=(q.x-o.x)/d*move;o.y+=(q.y-o.y)/d*move;move=0;}}return!o.path||!o.path.length;}
function moveFleets(dd){
 for(const f of S.fleets.slice()){if(f.state==='battle')continue;
  if(f.chase){const a=S.ai.find(x=>x.id===f.chase);if(!a){f.chase=null;f.path=[];}else{f.chaseT=(f.chaseT||0)+dd;const dA=Math.hypot(a.x-f.x,a.y-f.y);if(dA<60&&los(f,a))f.path=[{x:a.x,y:a.y}];else if(f.chaseT>.15||!f.path||!f.path.length){f.chaseT=0;const p=findPath(f.x,f.y,a.x,a.y);if(p)f.path=p;}
   if(Math.hypot(a.x-f.x,a.y-f.y)<10){f.chase=null;f.path=[];encounter(f,a);return;}}}
  if(f.path&&f.path.length){const done=stepAlong(f,dd,fleetSpeed(f));if(done){if(f.dest&&f.dest.set){const id=f.dest.set;f.dest=null;f.at=id;arrive(f,id);return;}}}
  reveal(f.x,f.y,80);}
}
function arrive(f,id){sideDirty=true;if(id===S.home){unloadHome(f);return;}if(S.settings.autoPauseArrive)setPaused(true);SEL={t:'fleet',id:f.id};openArrival(f,id);}
function unloadHome(f){const parts=[];if(f.silver){S.res.silver+=f.silver;parts.push(`${Math.round(f.silver)} silver`);f.silver=0;}
 for(const g in f.cargo){const q=f.cargo[g];if(!q)continue;if(GOODS[g].food){S.res.food+=q*GOODS[g].food;parts.push(`${q*GOODS[g].food} food`);}else if(g==='iron'){S.res.iron+=q;parts.push(`${q} iron`);}else if(g==='timber'){S.res.timber+=q*5;parts.push(`${q*5} timber`);}else if(g==='swords'){S.swords+=q;parts.push(`${q} swords for the hird`);}else{S.store[g]=(S.store[g]||0)+q;parts.push(`${q} ${GOODS[g].n.toLowerCase()}`);}}
 f.cargo={};if(f.food){S.res.food+=f.food;parts.push(`${Math.round(f.food)} food`);f.food=0;}
 if(f.captives){S.thralls+=f.captives;parts.push(`${f.captives} captives as thralls`);f.captives=0;}
 if(f.men.bondi){S.pop+=f.men.bondi;f.men.bondi=0;}
 log(`${f.name} returns to ${SET[S.home].name}${parts.length?' bringing '+parts.join(', '):''}.`,'good');if(parts.length)toast(`${f.name} is home: ${parts.join(', ')}.`);
 if(f.chief&&!S.flags.toldDock){S.flags.toldDock=1;}}
function disbandFleet(f){if(f.at!==S.home)return;unloadHome(f);S.hird+=f.men.hird||0;S.bow+=f.men.bow||0;S.berserk+=f.men.berserk||0;for(const sh of fleetShips(f))sh.loc='home';S.fleets=S.fleets.filter(x=>x!==f);if(SEL&&SEL.t==='fleet'&&SEL.id===f.id)SEL={t:'set',id:S.home};log(`${f.name} is drawn up on the beach; the men go home.`);sideDirty=true;}
function chiefFleet(){return S.fleets.find(f=>f.chief);}

/* ================= AI WORLD ================= */
const MARKETS=SETS.filter(s=>s.kind==='market').map(s=>s.id);
function aiVisible(a){for(const f of S.fleets)if(Math.hypot(a.x-f.x,a.y-f.y)<85)return true;for(const s of SETS){if(S.sets[s.id].own!=='player')continue;const g=SG[s.id];if(Math.hypot(a.x-g.x,a.y-g.y)<(s.id===S.home?130:100))return true;}return false;}
function spawnTrader(){const from=pick(MARKETS),to=pick(MARKETS);if(from===to)return;const a=SG[from].dock,b=SG[to].dock;if(dist(a,b)>1100)return;const p=findPath(a.x,a.y,b.x,b.y);if(!p)return;
 const ships=rnd()<.7?1:2;const fac=S.sets[from].own==='player'?'ind':S.sets[from].own;const g=pick(SET[from].prod);
 S.ai.push({id:S.nextId++,kind:'trade',fac,from,to,x:a.x,y:a.y,path:p,ships,men:ships*ri(8,14),value:Math.round(ships*(50+rnd()*140)),good:g,goods:ships*ri(8,20)});}
function moveAI(dd){for(const a of S.ai.slice()){const sp=a.kind==='trade'?88:110;const done=stepAlong(a,dd,sp);
  if(a.kind==='raid'&&!a.met){for(const f of S.fleets){if(f.state==='battle')continue;if(Math.hypot(a.x-f.x,a.y-f.y)<9&&aiVisible(a)){a.met=true;encounter(f,a);return;}}}
  if(done){S.ai=S.ai.filter(x=>x!==a);if(a.kind==='raid')raidArrive(a);else if(a.kind==='war')warArrive(a);}}}
function aiRaidCheck(){if(year()===START_YEAR&&doy()<150)return;
 for(const f in S.facs){const st=S.facs[f];if(st.ally)continue;if(!(st.rel<-35||st.griev>0))continue;let p=.02+Math.min(4,st.griev)*.022+Math.max(0,-st.rel-35)/450;if(FACS[f].big)p*=.75;if(rnd()<p&&launchRaid(f))return;}
 for(const s of SETS){const st=S.sets[s.id];if(st.own!=='ind'||st.rel>-40||st.men<18)continue;if(rnd()<.035&&launchRaid('ind',s.id))return;}
 if(year()>=794&&rnd()<.03)launchRaid('sea');}
function launchRaid(f,srcId){const targets=[S.home,...holdings()];let best=null,bd=1e9,src=null;
 if(f==='sea'){const tgt=pick(targets);const tg=SG[tgt].dock;for(let k=0;k<30;k++){const ang=rnd()*6.28,r=250+rnd()*200;const x=tg.x+Math.cos(ang)*r,y=tg.y+Math.sin(ang)*r;const c=cellAt(x,y);if(c<0||!NAV[c])continue;const p=findPath(x,y,tg.x,tg.y);if(!p)continue;
   if(S.ai.some(a=>a.kind==='raid'&&a.target===tgt))return false;const men=Math.round(clamp(setDefense(tgt)*(.45+rnd()*.55),18,160));S.ai.push({id:S.nextId++,kind:'raid',fac:'sea',src:null,target:tgt,x,y,path:p,ships:Math.ceil(men/32),men,leader:pick(NAMES_M)+' '+pick(NICK)});return true;}return false;}
 const srcs=srcId?[srcId]:SETS.filter(s=>S.sets[s.id].own===f).map(s=>s.id);
 for(const s of srcs)for(const t of targets){const d=dist(SG[s].dock,SG[t].dock);if(d<bd){bd=d;best=t;src=s;}}
 if(!best||bd>900||S.ai.some(a=>a.kind==='raid'&&a.target===best))return false;const pw=f==='ind'?S.sets[src].men:facPower(f);const men=Math.round(Math.min(pw*.45,Math.max(20,setDefense(best)*(.5+rnd()*.6))));if(men<15)return false;const help=coalitionHelp(f);
 const a=SG[src].dock,b=SG[best].dock;const p=findPath(a.x,a.y,b.x,b.y);if(!p)return false;
 S.ai.push({id:S.nextId++,kind:'raid',fac:f==='ind'?'ind':f,src,target:best,x:a.x,y:a.y,path:p,ships:Math.ceil((men+help)/32),men:men+help});
 if(f==='ind')S.sets[src].men-=Math.round(men*.6);
 const who=(f==='ind'?`the chieftain of ${SET[src].name}`:`${facRuler(f)} of the ${FACS[f].n}`)+(help?', with ships from his sworn ally,':'');
 if(S.sets[src].known||rnd()<.6){log(`Word comes: ${who} is gathering ships against ${SET[best].name}.`,'war');toast(`Warning: ${who} is gathering ships against ${SET[best].name}!`);}return true;}
function raidName(a){return a.fac==='sea'?`the sea-king ${a.leader}`:a.fac==='ind'?`men of ${SET[a.src].name}`:`the ${FACS[a.fac].n}`;}
function raidArrive(a){const id=a.target;const st=S.sets[id];if(st.own!=='player')return;
 if(id===S.home){setPaused(true);queueEvent(()=>evHomeRaided(a));return;}
 const D=setDefense(id),A=a.men*(a.fac==='frank'?1.3:1);const pw=D/(D+A*1.05);
 if(rnd()<pw){st.gar=Math.max(0,st.gar-Math.round(st.gar*(.1+rnd()*.25)));log(`${raidName(a)} fell on ${SET[id].name}, but your people drove them back to their ships.`,'good');addRenown(3,'a holding held');}
 else{const newOwn=a.fac==='sea'?'ind':a.fac;st.own=newOwn;st.trib=false;st.gar=0;st.men=Math.round(a.men*.6);st.wealth*=.6;if(newOwn==='ind')st.rel=-50;log(`${raidName(a)} took ${SET[id].name}! Your garrison is slain or scattered.`,'war');toast(`${SET[id].name} has fallen to ${raidName(a)}.`);addRenown(-10,`the loss of ${SET[id].name}`);
  if(S.facs[newOwn])S.facs[newOwn].griev=Math.max(0,S.facs[newOwn].griev-1);}}

/* ---- sea fights ---- */
function encounter(f,a){setPaused(true);SEL={t:'fleet',id:f.id};queueEvent(()=>evEncounter(f,a));}
function seaFight(f,a){const P0=fleetPower(f),E0=a.men*(a.kind==='trade'?.55:a.fac==='frank'?1.2:.95);let P=P0,E=E0;const chief=f.chief?1.1:1;
 for(let r=0;r<12;r++){const lp=E*(.1+rnd()*.06),le=P*chief*(.1+rnd()*.06);P-=lp;E-=le;if(E<E0*.4||P<P0*.4)break;}
 const win=E/E0<P/P0;const lossFrac=clamp(1-P/P0,0,.95);const lost={};for(const k of['hird','bondi','bow','berserk']){const l=Math.round((f.men[k]||0)*lossFrac*.75);f.men[k]-=l;lost[k]=l;}
 const dead=Object.values(lost).reduce((x,y)=>x+y,0);return{win,dead,eLeft:E/E0};}

const ACT={};
let modalT=0;
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;if(performance.now()-modalT<350&&b.closest('#modal'))return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset.arg,b);}});
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('toasts').appendChild(t);t.onclick=()=>t.remove();setTimeout(()=>t.remove(),7000);while($('toasts').children.length>5)$('toasts').firstChild.remove();}
let modalOpen=false,modalOnClose=null;const EVQ=[];
function showModal(html,onClose){if(!modalOpen)modalT=performance.now();$('mbox').innerHTML=html;$('modal').classList.remove('hidden');modalOpen=true;modalOnClose=onClose||null;$('mbox').scrollTop=0;}
function closeModal(){$('modal').classList.add('hidden');modalOpen=false;const c=modalOnClose;modalOnClose=null;if(c)c();sideDirty=true;setTimeout(runQueue,0);}
function queueEvent(fn){EVQ.push(fn);if(!modalOpen&&!battleOn)runQueue();}
function runQueue(){if(modalOpen||battleOn||!S)return;const fn=EVQ.shift();if(fn){try{fn();}catch(err){console.error(err);}}}
ACT.close=()=>closeModal();
function setPaused(p){if(!S)return;S.paused=p;$('pausedTag').style.display=p?'block':'none';updateSpeedBtns();}
function updateSpeedBtns(){document.querySelectorAll('#speed button').forEach(b=>{b.classList.toggle('on',b.dataset.act==='pause'?S.paused:(!S.paused&&+b.dataset.arg===S.speed));});}
ACT.pause=()=>setPaused(!S.paused);
ACT.speed=a=>{S.speed=+a;setPaused(false);};
window.addEventListener('keydown',e=>{if(!S||e.target.tagName==='INPUT')return;if(battleOn){battleKey(e);return;}if(e.key==='Escape'&&modalOpen){closeModal();return;}if(modalOpen)return;
 if(e.code==='Space'){e.preventDefault();setPaused(!S.paused);}else if(e.key==='1'||e.key==='2'||e.key==='3'){S.speed=[1,2,4][+e.key-1];setPaused(false);}else if(e.key==='h'||e.key==='H')ACT.hall();});
function select(h){SEL=h;sideDirty=true;const sd=$('side');if(sd)sd.scrollTop=0;}
const tag=(c,t)=>`<span class="pill ${c}">${esc(t)}</span>`;
function costStr(c){if(!c)return'';const p=[];if(c.timber)p.push(c.timber+' timber');if(c.iron)p.push(c.iron+' iron');if(c.silver)p.push(c.silver+' silver');if(c.days)p.push(c.days+' days');return p.join(', ');}
function canAfford(c){return(!c.timber||S.res.timber>=c.timber)&&(!c.iron||S.res.iron>=c.iron)&&(!c.silver||S.res.silver>=c.silver);}
function pay(c){if(c.timber)S.res.timber-=c.timber;if(c.iron)S.res.iron-=c.iron;if(c.silver)S.res.silver-=c.silver;}

function counselTips(){const t=[];const d=doy(),sail=isSailSeason(d);const atHome=S.ships.filter(s=>s.loc==='home').length;
 if(S.res.food<400)t.push('Food is short. Raid a weak village for grain, buy grain at a market, or build up fishing. Hungry folk leave or die.');
 if(!sail&&d>=258)t.push('Ships are drawn up until April. Spend the winter building in the Hall, giving arm-rings to keep the hird loyal, and recruiting for spring.');
 else if(!sail)t.push('Spring is coming. Ships can sail from April. Build in the Hall now so you are ready.');
 if(S.res.silver<60)t.push('Silver comes from: loot from raids, buying goods cheap at one market and selling dear at another, selling surplus grain (Hall → Store, once you have 700+ food), harvest tribute from places you hold, and a Trading place building.');
 if(sail&&S.stats.raids===0&&atHome)t.push('Muster a fleet and raid a small village nearby: click it, check "about N men" against your crew (bring at least half again as many), then Send a fleet.');
 if(sail&&S.stats.raids>0&&!S.fleets.length&&atHome)t.push('Your ships are idle in the sailing season. Raid, trade, or scout. Fog hides places you have not seen yet.');
 if(S.loyalty<35)t.push('The hird grows restless. Give arm-rings in the Hall (silver) or win a raid.');
 if(S.stats.raidWins>0&&!holdings().length&&rank()>=1)t.push('After a raid you win, you can Hold the place. Holdings send food, silver and goods home at every harvest and count toward your rank.');
 if(t.length<2&&S.capts.some(c=>c.loy<30))t.push(`${captName(S.capts.find(c=>c.loy<30))} grows restless. Give him a gift (Hall → Warband) before he turns on you.`);
 if(t.length<2&&holdings().some(id=>!S.sets[id].trib&&specOf(id).length<specSlots(id))&&S.res.timber>=40)t.push('A holding has empty plots. Hall → Holdings → Develop: choose fields, a trading post, a ringfort and so on.');
 if(t.length<2&&S.ai.some(a=>a.kind==='war'&&aiVisible(a)))t.push('A rival war fleet is at sea. Catch it before it lands and you weaken its jarl; or let him bleed against the free chieftains.');
 if(t.length<2&&!S.spouse&&ageOf(S.ruler)>=20)t.push('You are unmarried. Hall → Kin lists the halls where you could seek a match and what each one needs.');
 return t.slice(0,2);}

 if(SEL.t==='set'){const s=SET[SEL.id],st=S.sets[s.id];if(!s)return'';const f=SEL.prevFleet?fleetById(SEL.prevFleet):null;

 return'';}

  <p class="small">Arms: smithy level ${S.bld.smith}, ${S.swords} Frankish blades. Your hird fights ${Math.round(armsBonus()*100)}% better than plain-armed men.</p>`+captainsHTML();}
 if(hallTab==='ships'){const home=S.ships.filter(s=>s.loc==='home');h+=`<h3>Ships drawn up at home</h3>${home.length?`<table class="t"><tr><th>Ship</th><th>Type</th><th>Seats</th><th>Hold</th><th>Condition</th></tr>${home.map(s=>`<tr><td>${esc(s.name)}</td><td>${SHIPS[s.type].n}</td><td>${SHIPS[s.type].seats}</td><td>${SHIPS[s.type].cargo}</td><td>${Math.round(s.hp)}%</td></tr>`).join('')}</table>`:'<p class="small">None. All your ships are at sea.</p>'}
  <h3>Boatyard (level ${S.bld.yard})</h3>${S.yardJob?`<p class="story">The ${esc(S.yardJob.name)} (${SHIPS[S.yardJob.type].n}) is on the slipway: ${S.yardJob.left} days left.</p>`:''}
  <div class="grid2">${Object.keys(SHIPS).map(k=>{const T=SHIPS[k];const ok=S.bld.yard>=T.yard;return`<div class="bld"><h4>${T.n}</h4><div class="small">${esc(T.d)}<br>${T.seats} oars & warriors · hold ${T.cargo} · ${T.spd} km a day</div><div class="small"><b>${costStr(T.cost)}, ${T.days} days</b>${ok?'':`<br><i>needs boatyard level ${T.yard}</i>`}</div><button class="sm" data-act="buildship" data-arg="${k}" ${!ok||S.yardJob||!canAfford(T.cost)?'disabled':''}>Lay the keel</button></div>`;}).join('')}</div>`;}
 if(hallTab==='store'){const g=Object.keys(S.store).filter(k=>S.store[k]>0);h+=`<p class="small">Goods brought home or sent by your holdings. Load them onto a fleet to sell at a far market. Grain, fish, iron and swords go straight to use when unloaded.</p>${g.length?`<table class="t"><tr><th>Goods</th><th>In store</th></tr>${g.map(k=>`<tr><td>${GOODS[k].n}</td><td>${S.store[k]}</td></tr>`).join('')}</table>`:'<p><i>The storehouse is empty.</i></p>'}
  <h3>Thralls</h3><p class="small">${S.thralls} unfree workers labour in your fields (each counts a little more than a free worker at harvest). Freeing thralls was a pious and honoured act.</p><button data-act="freethralls" ${S.thralls<5?'disabled':''}>Free 5 thralls (+3 renown; they join your free folk)</button>
  ${S.bld.market?`<h3>Your trading place</h3><p class="small">Merchants who stop at your beach sell a few staples.</p><table class="t">${['grain','iron','salt'].map(k=>`<tr><td>${GOODS[k].n}</td><td>${homePrice(k).toFixed(1)} silver</td><td><button class="sm" data-act="homebuy" data-arg="${k}:10" ${S.res.silver<homePrice(k)*10?'disabled':''}>Buy 10</button></td></tr>`).join('')}</table><p class="small">Passing traders will also buy your surplus grain, though cheaply.</p><button data-act="homesell" ${S.res.food<700?'disabled':''}>Sell 400 food (${Math.round(homeSellGrain()*20)} silver)</button>`:''}`;}
 if(hallTab==='kin'){const R=S.ruler;const heir=heirOf();h+=`<div class="kinrow">${pimg(portraitOf('ruler',R),'big')}${S.spouse?pimg(portraitOf('spouse',S.spouse),'big'):''}</div><h3>${esc(rulerName(R))}</h3><p>${RANKS[rank()].n} of ${esc(SET[S.home].name)}, ${ageOf(R)} winters old. Generation ${S.generation} of ${esc(S.kin)}.</p>
  <p>${S.spouse?`Married to <b>${esc(S.spouse.name)}</b>${S.spouse.from?' of the '+esc(FACS[S.spouse.from]?FACS[S.spouse.from].n:S.spouse.from):''}.`:'Unmarried. A marriage brings heirs and allies.'+marryListHTML()}</p>
  ${S.kids.length?`<table class="t"><tr><th>Children</th><th>Age</th></tr>${S.kids.map(k=>`<tr><td>${esc(k.name)} (${k.sex==='m'?'son':'daughter'})</td><td>${year()-k.born}</td></tr>`).join('')}</table>`:'<p class="small">No children yet.</p>'}
  <p class="small">Heir: <b>${heir?esc(heir.name)+(year()-heir.born<14?' (a child: there would be a regency)':''):'none; a kinsman would claim the hall'}</b></p>
  ${S.spouse?'':`<button data-act="localmatch" ${S.res.silver<40?'disabled':''}>Marry a daughter of a local farmer (40 silver bride-price)</button>`}`;}
 if(hallTab==='hold'){const hs=holdings();h+=hs.length?`<p class="small">Each holding has one plot per size. Shape each place for one purpose: fields, trade, defence, warriors, ships or worship. A steward (one of your captains) rules it in your name.</p><table class="t"><tr><th>Place</th><th>Status</th><th>Plots</th><th>Steward</th><th>Yield each harvest</th><th></th></tr>${hs.map(id=>{const s=SET[id],st=S.sets[id];const Y=holdYield(id);const sc=captById(st.stew);return`<tr><td><a href="#" data-act="selset" data-arg="${id}">${esc(s.name)}</a><div class="small">${st.trib?'':'garrison '+st.gar}</div></td><td>${st.trib?'Tributary':st.fief?'Jarldom':'Held'}</td><td class="small">${st.trib?'—':specOf(id).map(k=>SPEC[k].icon+' '+esc(SPEC[k].n)).join('<br>')+(specOf(id).length<specSlots(id)?`<br><button class="sm" data-act="specpick" data-arg="${id}">Develop (${specSlots(id)-specOf(id).length} free)</button>`:'')}</td><td class="small">${st.trib?'—':sc?esc(captName(sc))+(st.fief?'':` <button class="sm alt" data-act="captrecall" data-arg="${id}">Recall</button>`):`<button class="sm" data-act="stewpick" data-arg="${id}">Appoint</button>`}</td><td class="small">${Math.round(Y.food)} food, ${Math.round(Y.silver)} silver${Y.timber?', '+Math.round(Y.timber)+' timber':''}</td><td>${st.trib?`<button class="sm alt" data-act="release" data-arg="${id}">Release</button>`:st.fief?'':`<button class="sm alt" data-act="maketrib" data-arg="${id}">Make tributary</button>`}</td></tr>`;}).join('')}</table><p class="small">To change a garrison, or to turn a tributary into a holding you rule directly, bring a fleet there and go ashore.</p>`:'<p><i>You hold no land beyond your own. Conquer a village, or frighten one into paying tribute.</i></p>';}
 return h+'</div>';}
ACT.build=k=>{const l=S.bld[k],c=BLD[k].cost[l+1];if(!c||S.building||!canAfford(c))return;pay(c);S.building={k,left:c.days};log(`Work begins on the ${BLD[k].n}.`);toast(`You ordered: ${BLD[k].n}, level ${l+1} (${c.days} days).`);rerenderHall();};
ACT.buildship=k=>{const T=SHIPS[k];if(S.yardJob||!canAfford(T.cost)||S.bld.yard<T.yard)return;pay(T.cost);const used=S.ships.map(s=>s.name);const nm=SHIP_NAMES.find(n=>!used.includes(n))||('Ship '+S.nextId);S.yardJob={type:k,left:T.days,name:nm};log(`The shipwrights lay the keel of a ${T.n}.`);rerenderHall();};
ACT.recruit=a=>{const[k,n0]=a.split(':');const c=RECRUIT[k];let n=+n0;if(k==='hird')n=Math.min(n,hirdCap()-totalMen('hird'));if(k==='bow')n=Math.min(n,Math.floor(hirdCap()/2)+5-totalMen('bow'));if(k==='berserk')n=Math.min(n,12-totalMen('berserk'));
 const lim={cap:n,silver:Math.floor(S.res.silver/c.silver),iron:c.iron?Math.floor(S.res.iron/c.iron):99,folk:Math.floor(S.pop-15)};n=Math.min(lim.cap,lim.silver,lim.iron,lim.folk);if(n<=0){const why=lim.cap<=0?(k==='hird'?`Your hird is full (${totalMen('hird')}/${hirdCap()}, counting men in fleets and garrisons). Enlarge the longhouse, rise in rank, or build a muster ground.`:'You have as many of these as your hall can keep.'):lim.iron<=0?`Each warrior needs 1 iron for his weapons and you have ${Math.floor(S.res.iron)}. Build a smithy, buy iron at a market, or raid for it.`:lim.silver<=0?`Not enough silver: each costs ${c.silver}.`:'Too few free folk at home: at least 15 must stay to work the land.';toast(why);return;}
 S.pop-=n;S[k]+=n;S.res.silver-=c.silver*n;S.res.iron-=(c.iron||0)*n;rerenderHall();};
ACT.dismiss=a=>{const[k,n0]=a.split(':');const n=Math.min(+n0,S[k]);if(n<=0)return;S[k]-=n;S.pop+=n;rerenderHall();};
ACT.rings=a=>{const n=+a;if(S.res.silver<n)return;S.res.silver-=n;S.loyalty=clamp(S.loyalty+(n>=80?30:12),0,100);if(n>=80)addRenown(6,'a great gift-giving');else log('You hand out arm-rings in the hall.');rerenderHall();};
ACT.freethralls=()=>{if(S.thralls<5)return;S.thralls-=5;S.pop+=5;addRenown(3,'freeing thralls');rerenderHall();};
function homePrice(k){return mprice('kaupang',k)*1.15;}
function homeSellGrain(){return mprice('kaupang','grain')*.7;}
ACT.homesell=()=>{if(S.res.food<700)return;S.res.food-=400;S.res.silver+=homeSellGrain()*20;rerenderHall();};
ACT.homebuy=a=>{const[k,n]=a.split(':');const c=homePrice(k)*n;if(S.res.silver<c)return;S.res.silver-=c;if(k==='grain')S.res.food+=GOODS.grain.food*n;else if(k==='iron')S.res.iron+=+n;else S.store[k]=(S.store[k]||0)+ +n;rerenderHall();};
ACT.localmatch=()=>{if(S.spouse||S.res.silver<40)return;S.res.silver-=40;const m=S.ruler.sex==='m';S.spouse={name:pick(m?NAMES_F:NAMES_M),from:''};log(`${rulerName(S.ruler)} marries ${S.spouse.name}, child of a wealthy farmer.`,'good');rerenderHall();};
ACT.directrule=a=>{const[fid,id,n0]=a.split(':');const f=fleetById(+fid),st=S.sets[id],n=+n0;if(!f||!st||!st.trib||st.own!=='player'||f.men.hird<n)return;f.men.hird-=n;st.trib=false;st.gar=n;st.men=Math.round(baseMen(SET[id])*.3);addRenown(4,`direct rule over ${SET[id].name}`);log(`You take direct rule of ${SET[id].name}. ${n} hirdmen stay as its garrison.`,'good');openArrival(f,id);};
ACT.maketrib=id=>{const st=S.sets[id];if(!st||st.own!=='player'||st.trib||st.fief)return;S.hird+=st.gar;st.gar=0;st.stew=0;st.trib=true;st.men=Math.max(st.men,Math.round(baseMen(SET[id])*.4));log(`${SET[id].name} becomes a tributary under its own chief. The garrison comes home.`);rerenderHall();};
ACT.release=id=>{const st=S.sets[id];if(!st||st.own!=='player')return;st.own=st.orig==='player'?'ind':st.orig;st.trib=false;st.rel=10;if(S.facs[st.own])S.facs[st.own].rel+=10;log(`You release ${SET[id].name} from tribute.`);rerenderHall();};
function heirOf(){const k=S.kids.slice().sort((a,b)=>a.born-b.born);return k.find(x=>x.sex==='m')||k[0]||null;}

/* ================= FLEET EDITOR (muster) ================= */
let FE=null;
ACT.muster=()=>{if(!S.ships.some(s=>s.loc==='home')){toast('No ships are drawn up at home.');return;}FE={fid:null,ships:new Set(),men:{hird:0,bow:0,berserk:0,bondi:0},cargo:{},chief:!chiefFleet(),lead:chiefFleet()?((S.capts.find(captFree)||{}).id||null):'chief'};
 const sh=S.ships.filter(s=>s.loc==='home'&&s.hp>30);if(sh[0])FE.ships.add(sh[0].id);autoCrew();showModal(feHTML());};
ACT.editfleet=a=>{const f=fleetById(+a);if(!f||f.at!==S.home)return;unloadHome(f);FE={fid:f.id,ships:new Set(fleetShips(f).map(s=>s.id)),men:Object.assign({hird:0,bow:0,berserk:0,bondi:0},f.men),cargo:Object.assign({},f.cargo),chief:f.chief,lead:f.chief?'chief':(f.capt||null)};showModal(feHTML());};
function feAvail(){const f=FE.fid?fleetById(FE.fid):null;const m=f?f.men:{};const c=f?f.cargo:{};return{hird:S.hird+(m.hird||0),bow:S.bow+(m.bow||0),berserk:S.berserk+(m.berserk||0),bondi:Math.max(0,Math.floor(S.pop-25))+(m.bondi||0),cargo:k=>k==='grain'?Math.floor(Math.max(0,S.res.food-300)/20)+(c[k]||0):k==='timber'?Math.floor(Math.max(0,S.res.timber-20)/5)+(c[k]||0):(S.store[k]||0)+(c[k]||0)};}
function feSeats(){let n=0,c=0;for(const id of FE.ships){const s=S.ships.find(x=>x.id===id);if(s){n+=SHIPS[s.type].seats;c+=SHIPS[s.type].cargo;}}return{seats:n,cargo:c};}
function feMen(){return FE.men.hird+FE.men.bow+FE.men.berserk+FE.men.bondi;}
function autoCrew(){const av=feAvail(),cap=feSeats().seats;FE.men={hird:0,bow:0,berserk:0,bondi:0};let left=cap;for(const k of['berserk','hird','bow']){const n=Math.min(av[k],left);FE.men[k]=n;left-=n;}}
function feHTML(){const av=feAvail(),cap=feSeats();const f=FE.fid?fleetById(FE.fid):null;const shipsAvail=S.ships.filter(s=>s.loc==='home'||(f&&s.loc===f.id));const cu=Object.values(FE.cargo).reduce((a,b)=>a+b,0);
 const step=(k,v,max)=>`<span class="stepper"><button class="sm alt" data-act="fem" data-arg="${k}:-10">−10</button><button class="sm alt" data-act="fem" data-arg="${k}:-1">−</button><b>${v}</b><button class="sm alt" data-act="fem" data-arg="${k}:1">+</button><button class="sm alt" data-act="fem" data-arg="${k}:10">+10</button></span> <span class="small">of ${max}</span>`;
 const other=chiefFleet();const chiefOk=!other||other.id===FE.fid;
 return`<button class="x" data-act="close">✕</button><h2>${f?'Manage '+esc(f.name):'Muster a fleet'}</h2>
 <h3>Ships</h3><div class="row">${shipsAvail.map(s=>`<button class="${FE.ships.has(s.id)?'gold':'alt'}" data-act="feship" data-arg="${s.id}">${FE.ships.has(s.id)?'✔ ':''}${esc(s.name)} · ${SHIPS[s.type].n} (${SHIPS[s.type].seats}/${SHIPS[s.type].cargo})${s.hp<100?' '+Math.round(s.hp)+'%':''}</button>`).join('')}</div>
 <h3>Crew: ${feMen()}/${cap.seats} seats</h3><table class="t">${['hird','berserk','bow','bondi'].map(k=>`<tr><td><b>${UT[k].n}</b><div class="small">${esc(UT[k].d)}</div></td><td>${step(k,FE.men[k],av[k])}</td></tr>`).join('')}</table>
 <div class="row"><button class="sm" data-act="feauto">Fill seats with warriors</button></div>
 <h3>Cargo: ${cu}/${cap.cargo}</h3><p class="small">Surplus food can be loaded as grain (20 food a load) and timber as logs (5 timber a load) to sell abroad; 300 food and 20 timber always stay home.</p>${Object.keys(GOODS).filter(k=>av.cargo(k)>0).length?`<table class="t">${Object.keys(GOODS).filter(k=>av.cargo(k)>0).map(k=>`<tr><td>${GOODS[k].n}</td><td><span class="stepper"><button class="sm alt" data-act="fec" data-arg="${k}:-10">−10</button><button class="sm alt" data-act="fec" data-arg="${k}:-1">−</button><b>${FE.cargo[k]||0}</b><button class="sm alt" data-act="fec" data-arg="${k}:1">+</button><button class="sm alt" data-act="fec" data-arg="${k}:10">+10</button></span> <span class="small">of ${av.cargo(k)}</span></td></tr>`).join('')}</table>`:'<p class="small">Nothing in the storehouse to load.</p>'}
 <h3>Leader</h3><p class="small">Who commands this fleet? With you aboard, men fight hardest and the glory is all yours, but chieftains can fall. A captain's traits shape how his men fight.</p><div class="row"><button class="${FE.lead==='chief'?'gold':'alt'}" data-act="felead" data-arg="chief" ${chiefOk?'':'disabled'}>★ ${esc(rulerName(S.ruler))}${chiefOk?'':' (leads another fleet)'}</button>${S.capts.filter(c=>captFree(c)||(f&&f.capt===c.id)).map(c=>`<button class="${FE.lead===c.id?'gold':'alt'}" data-act="felead" data-arg="${c.id}">${esc(captName(c))} <small>${'★'.repeat(captLvl(c))} ${c.traits.map(t=>esc(TRAITS[t].n)).join(', ')}</small></button>`).join('')}<button class="${FE.lead==null?'gold':'alt'}" data-act="felead" data-arg="none">No captain (−10 morale)</button></div>
 <div class="row" style="margin-top:12px"><button class="big gold" data-act="felaunch" ${FE.ships.size&&feMen()>0?'':'disabled'}>${f?'Done':'Launch'}</button><button class="big alt" data-act="close">Cancel</button></div>`;}
ACT.feship=a=>{const id=+a;if(FE.ships.has(id))FE.ships.delete(id);else FE.ships.add(id);const cap=feSeats();while(feMen()>cap.seats){for(const k of['bondi','bow','hird','berserk']){if(feMen()>cap.seats&&FE.men[k]>0)FE.men[k]=Math.max(0,FE.men[k]-(feMen()-cap.seats));}}$('mbox').innerHTML=feHTML();};
ACT.fem=a=>{const[k,d]=a.split(':');const av=feAvail(),cap=feSeats().seats;let v=FE.men[k]+ +d;v=clamp(v,0,av[k]);const others=feMen()-FE.men[k];v=Math.min(v,cap-others);FE.men[k]=Math.max(0,v);$('mbox').innerHTML=feHTML();};
ACT.fec=a=>{const[k,d]=a.split(':');const av=feAvail(),cap=feSeats().cargo;const cu=Object.values(FE.cargo).reduce((x,y)=>x+y,0)-(FE.cargo[k]||0);FE.cargo[k]=Math.max(0,Math.min(clamp((FE.cargo[k]||0)+ +d,0,av.cargo(k)),cap-cu));$('mbox').innerHTML=feHTML();};
ACT.feauto=()=>{autoCrew();$('mbox').innerHTML=feHTML();};
ACT.felead=a=>{FE.lead=a==='chief'?'chief':a==='none'?null:+a;FE.chief=FE.lead==='chief';$('mbox').innerHTML=feHTML();};
ACT.felaunch=()=>{let f=FE.fid?fleetById(FE.fid):null;const g=SG[S.home].dock;
 if(f){S.hird+=f.men.hird||0;S.bow+=f.men.bow||0;S.berserk+=f.men.berserk||0;S.pop+=f.men.bondi||0;for(const k in f.cargo)S.store[k]=(S.store[k]||0)+f.cargo[k];for(const sh of fleetShips(f))sh.loc='home';}
 else{f={id:S.nextId++,name:'',x:g.x,y:g.y,path:[],dest:null,at:S.home,men:{},cargo:{},silver:0,captives:0,chief:false,heading:0};S.fleets.push(f);}
 for(const id of FE.ships){const s=S.ships.find(x=>x.id===id);if(s)s.loc=f.id;}
 f.men={hird:Math.min(FE.men.hird,S.hird),bow:Math.min(FE.men.bow,S.bow),berserk:Math.min(FE.men.berserk,S.berserk),bondi:Math.min(FE.men.bondi,Math.max(0,Math.floor(S.pop-5)))};S.hird-=f.men.hird;S.bow-=f.men.bow;S.berserk-=f.men.berserk;S.pop-=f.men.bondi;
 f.cargo={};for(const k in FE.cargo){if(k==='timber'){const q=Math.min(FE.cargo.timber,Math.floor(Math.max(0,S.res.timber-20)/5));if(q>0){f.cargo.timber=q;S.res.timber-=q*5;}continue;}if(k==='grain'){const q=Math.min(FE.cargo.grain,Math.floor(Math.max(0,S.res.food-300)/20));if(q>0){f.cargo.grain=q;S.res.food-=q*20;}continue;}const q=Math.min(FE.cargo[k],S.store[k]||0);if(q>0){f.cargo[k]=q;S.store[k]-=q;}}
 f.chief=FE.lead==='chief'&&(!chiefFleet()||chiefFleet()===f);const cpt=!f.chief&&FE.lead?captById(FE.lead):null;f.capt=cpt&&(captFree(cpt)||f.capt===cpt.id)?cpt.id:null;const lead=fleetShips(f)[0];f.name=(f.chief?rulerName(S.ruler).split(' ')[0]+"'s fleet":f.capt?captById(f.capt).name+"'s fleet":'Fleet of the '+(lead?lead.name:'North'));
 if(!fleetShips(f).length){S.fleets=S.fleets.filter(x=>x!==f);closeModal();return;}
 SEL={t:'fleet',id:f.id};FE=null;closeModal();toast(`${f.name} is ready. Tap a place on the map, then "Send a fleet".`);};

/* ================= ARRIVAL ================= */
function openArrival(f,id){const s=SET[id],st=S.sets[id];st.known=true;const r=relOf(id);let h=`<button class="x" data-act="close">✕</button><h2>${esc(f.name)} at ${esc(s.name)}</h2>`;
 if(st.own==='player'){h+=`<p>${esc(s.name)} is ${st.trib?'your tributary':'your holding'}.</p>`;
  if(!st.trib)h+=`<h3>Garrison: ${st.gar} hirdmen</h3><p class="small">A garrison keeps the place loyal and guards it against raiders. Hirdmen left here are still paid from your treasury.</p><div class="row"><button data-act="gar" data-arg="${f.id}:${id}:5" ${f.men.hird<5?'disabled':''}>Leave 5 hirdmen</button><button data-act="gar" data-arg="${f.id}:${id}:-5" ${st.gar<5||fleetMen(f)+5>fleetSeats(f)?'disabled':''}>Take 5 aboard</button></div>`;
  if(st.trib)h+=`<h3>Tributary</h3><p class="small">Their own chief rules and pays you half the yield. Leave a garrison to rule it directly: full yield and plots you can develop, but you must defend it.</p><div class="row">${[5,10,20].map(n=>`<button data-act="directrule" data-arg="${f.id}:${id}:${n}" ${f.men.hird<n?'disabled':''}>Rule directly (leave ${n} hirdmen)</button>`).join('')}</div>`;
  if(s.kind==='market')h+=`<div class="row" style="margin-top:8px"><button data-act="market" data-arg="${f.id}:${id}">Trade at the market</button></div>`;

 const fp=Math.round(fleetPower(f)),dp=Math.round(setDefense(id));

 h+=`<button class="choice red" data-act="raid" data-arg="${f.id}:${id}">Strike at dawn<small>Land and attack. Plunder silver, food, goods and captives, and get back to the ships before the countryside gathers. Win outright and you may take the place.</small></button>`;

 if(s.kind==='market'||s.kind==='seat')h+=`<button class="choice" data-act="hire" data-arg="${f.id}:${id}" ${S.res.silver+f.silver<12||fleetMen(f)>=fleetSeats(f)?'disabled':''}>Hire landless warriors (12 silver each)<small>Young men without land look for a lord with a ship. They join this fleet as hirdmen if your hall has room.</small></button>`;
 if(!S.spouse&&marrySeat(id)){const why=marryBlock(id);h+=`<button class="choice" data-act="marry" data-arg="${f.id}:${id}" ${why?'disabled':''}>Seek a marriage with ${esc(st.own==='ind'?'the chieftain of '+s.name:facRuler(st.own))}'s kin<small>${why?esc(why):'An alliance by marriage: heirs, and a friend who will not raid you.'}</small></button>`;}

function arrivalFlavor(s,st,r){if(S.t-st.raided<200)return'Burnt thatch and fresh graves. They remember you, and they watch your sails with hatred.';if(r<-50)return'Horns sound along the shore. Armed men gather on the beach before your keels touch sand.';if(s.kind==='market')return'Dozens of ships are drawn up on the strand. Smoke rises from the workshops; merchants weigh silver on folding scales.';if(s.kind==='sacred')return'Above the bay stands a hall of the gods, its gables carved with beasts. Offerings hang from the trees nearby.';if(s.kind==='fort')return'A ring of earth and timber crowns the hill. Watchers on the wall follow your ships.';if(s.kind==='seat')return'A great hall stands among the farms, smoke curling from its roof-hole. The chieftain\'s men watch you land.';return'A cluster of farms by the shore: longhouses, byres and fishing boats pulled up on the shingle.';}
ACT.gar=a=>{const[fid,id,n]=a.split(':');const f=fleetById(+fid),st=S.sets[id];const k=+n;if(k>0){const m=Math.min(k,f.men.hird);f.men.hird-=m;st.gar+=m;}else{const m=Math.min(-k,st.gar,fleetSeats(f)-fleetMen(f));st.gar-=m;f.men.hird+=m;}openArrival(f,id);};

function spend(f,n){const a=Math.min(f?f.silver:0,n);if(f)f.silver-=a;S.res.silver-=n-a;}
const purse=f=>S.res.silver+(f?f.silver:0);

ACT.demand=a=>{const[fid,id]=a.split(':');const f=fleetById(+fid);const s=SET[id],st=S.sets[id];const ratio=fleetPower(f)*(1+S.renown/700)*(f.chief?1.1:1)/Math.max(5,setDefense(id));const bigSeat=st.own!=='ind'&&FACS[st.own].seat===id;

 else if(ratio>=1.4){const amt=Math.round(s.size*28*st.wealth*(s.kind==='market'?1.8:1)+5);f.silver+=amt;st.wealth=Math.max(.2,st.wealth-.2);changeRel(id,-15);addRenown(4,`scot taken from ${s.name}`);h+=`<p class="story">They will not bend the knee, but they pay to see your sails go: ${amt} silver weighed out on the beach.</p>`;log(`${s.name} pays you ${amt} silver to leave.`);}
 else{changeRel(id,-8);st.alert=S.t;h+=`<p class="story">They laugh at you from behind their shields. Messengers run inland to raise the farms. If you attack now, they will be ready.</p>`;}

function mprice(id,g){const m=(MKT[id]&&MKT[id][g])||1.2;const sat=(S.mk[id]&&S.mk[id][g])||0;return GOODS[g].b*m*(1+sat*.5);}

ACT.market=a=>{const[fid,id]=a.split(':');MK={f:+fid,id};showModal(marketHTML());};
function marketHTML(){const f=fleetById(MK.f),id=MK.id;const cap=fleetCargoCap(f),used=cargoUsed(f);
 let h=`<button class="x" data-act="mkback">✕</button><h2>Market at ${esc(SET[id].name)}</h2><p class="small">Your purse: <b>${Math.round(purse(f))}</b> silver (${Math.round(f.silver)} aboard). Hold: <b>${used}/${cap}</b>. Prices rise as you buy and fall as you sell; they recover over weeks.</p>
 <table class="t"><tr><th>Goods</th><th>Buy at</th><th>Sell at</th><th>Aboard</th><th></th></tr>`;
 for(const g of Object.keys(GOODS)){const p=mprice(id,g),sell=p*.82,has=f.cargo[g]||0,sells=sellsHere(id,g);const m=(MKT[id]&&MKT[id][g])||1.2;const hint=m<=.75?tag('ok','cheap here'):m>=1.35?tag('bad','in demand'):'';
  h+=`<tr><td><b>${GOODS[g].n}</b> ${hint}<div class="small">${esc(GOODS[g].d)}</div></td><td>${sells?p.toFixed(1):'<span class="muted">none</span>'}</td><td>${sell.toFixed(1)}</td><td>${has}</td><td>${sells?`<button class="sm" data-act="mkbuy" data-arg="${g}:1">Buy</button><button class="sm" data-act="mkbuy" data-arg="${g}:10">10</button>`:''}${has?`<button class="sm alt" data-act="mksell" data-arg="${g}:1">Sell</button><button class="sm alt" data-act="mksell" data-arg="${g}:${has}">All</button>`:''}</td></tr>`;}
 h+=`</table>${f.captives?`<p class="small">You have ${f.captives} captives aboard. Bring them home as thralls, or ransom them back to their own people where you took them.</p>`:''}<div class="row" style="margin-top:10px"><button class="alt" data-act="mkback">Done</button></div>`;return h;}
ACT.mkbuy=a=>{const[g,n0]=a.split(':');const f=fleetById(MK.f),id=MK.id;let n=+n0;n=Math.min(n,fleetCargoCap(f)-cargoUsed(f));let bought=0;
 for(let k=0;k<n;k++){const p=mprice(id,g);if(purse(f)<p)break;spend(f,p);f.cargo[g]=(f.cargo[g]||0)+1;f.basis=f.basis||{};f.basis[g]=((f.basis[g]||0)*(f.cargo[g]-1)+p)/f.cargo[g];S.mk[id]=S.mk[id]||{};S.mk[id][g]=Math.min(1.5,(S.mk[id][g]||0)+.012);bought++;}
 if(!bought)toast(fleetCargoCap(f)<=cargoUsed(f)?'The hold is full.':'Not enough silver.');$('mbox').innerHTML=marketHTML();};
ACT.mksell=a=>{const[g,n0]=a.split(':');const f=fleetById(MK.f),id=MK.id;const n=Math.min(+n0,f.cargo[g]||0);let got=0;
 const shr=has(fleetLeader(f),'shrewd')?1.1:1;for(let k=0;k<n;k++){const p=mprice(id,g)*.82*shr;got+=p;f.cargo[g]--;S.mk[id]=S.mk[id]||{};S.mk[id][g]=Math.max(-.8,(S.mk[id][g]||0)-.012);}
 f.silver+=got;const basis=(f.basis&&f.basis[g])||GOODS[g].b*.7;const profit=got-basis*n;if(profit>0){S.stats.profit+=profit;if(dist(SG[id],SG[S.home])>700)addRenown(Math.min(8,profit/60),null);}S.stats.trades++;if(id==='aldeigja'||id==='holmgard')S.flags.tradedEast=1;
 if(!f.cargo[g])delete f.cargo[g];$('mbox').innerHTML=marketHTML();};
ACT.mkback=()=>{const f=fleetById(MK.f);closeModal();if(f&&f.at&&S.sets[f.at].own!=='player')setTimeout(()=>{if(!modalOpen)openArrival(f,f.at);},0);};
