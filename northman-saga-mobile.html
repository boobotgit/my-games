const HOWTO=`<p><b>Captains.</b> Your sons (from 15) and sworn men lead your fleets and rule your holdings as stewards. Each has two traits (Bold, Cautious, Shrewd, Seafarer, Cruel, Beloved, Greedy, Ambitious, Fierce, Wise) that change how his men fight and trade. Keep their loyalty up with gifts (Hall → Warband): an ambitious captain who sinks too low may keep his holding or sail off with his fleet.</p><p><b>Rival jarls.</b> Two neighbouring jarls compete with you for the same land. They take free villages, marry into the great kingdoms, raid you, and may swear together against you once you rise. Take a jarl's last hall and he is yours to kill, exile or take into service.</p><p><b>Battle.</b> Raids begin as your warriors leap from the ships. When raiders come to your own hall, you first place your defenders (or pick Line or Wedge); which gate you guard matters. Ground matters: higher ground helps, streams must be crossed at a ford, woods stop arrows. Attacks from the side hit 1.4 times as hard and from behind 1.8 times, and a shield wall only protects its front. So pin them with one warband and hit the flank with another. A palisade can only be crossed at its gates, and men fighting across the stakes do little harm. <b>Fall back (F)</b> pulls a warband out of a fight in good order (it takes some blows as it goes). A warband whose morale breaks is <b>routed</b>: it runs for the ships or the edge of the field. If no enemy is near after a few seconds it may rally. Warbands standing beside a house loot it; the bar under each house shows what is left.</p><p><b>Unit matchups.</b> Every warband has a job. Hirdmen hook and break shield walls (ability: throw spears just before the clash). Bondi and levies with spears stop horsemen, and when braced, any charge into their front fails (ability: brace spears). Bowmen and archers cut down unarmoured men, above all berserkers (ability: volley). Berserkers terrify farmers and levies (ability: war cry), but arrows cut them down. Frankish horse rides down archers and farmers in the open. Select a warband and press its gold ability button (Q).</p><p><b>Holdings.</b> Each holding has one plot per size. Choose what each place is for (Hall → Holdings → Develop): fields, a trading post, a ringfort, a muster ground, ship-sheds or a hof.</p><p><b>Your aim.</b> Lead your kin from a single hall to lordship over the North, and open the East Way to Ladoga. Each chapter of the saga sets goals (see the sidebar or <i>Saga</i>).</p>
<p><b>Time.</b> Days pass while unpaused (the ▶ buttons set the speed). Ships sail from April to October; winter voyages risk gales. Grain is harvested in mid-September; feasts come at Winter Nights and Yule.</p>
<p><b>Food.</b> Your people, warriors and crews all eat. Fishing feeds you in summer and the harvest must last the winter. Raids, trade (grain, stockfish) and tribute fill the gap. Hunger kills folk and loyalty.</p>
<p><b>Fleets.</b> In the hall, <i>Muster a fleet</i>: choose ships, warriors and cargo. Tap a place on the map and use its <i>Send a fleet</i> buttons (or hold your finger on the sea). Bondi (farmers) can row and fight, but harvests suffer when they are away.</p>
<p><b>At a foreign shore</b> you may trade, demand tribute, give gifts, hire warriors, or <i>Strike at dawn</i>. Raids are fought on a battlefield: tap a warband card to select it, tap the ground to move, tap an enemy to attack. Stand next to houses to loot them. Local farmers keep arriving, so get back to the ships before you are overwhelmed. Win outright and you may take the place as a holding, make it pay tribute, or burn it.</p>
<p><b>Holdings</b> send food, silver and goods each autumn and count toward your rank. Held places need a garrison; tributaries keep their own chief but pay only half. Angry peoples raid back. Watch the sidebar for sails.</p>
<p><b>Renown</b> comes from raids, victories, feasts and gifts. It raises your rank: Hersir, Jarl, King. Rank lets you keep more hirdmen and build greater halls and ships.</p>
<p><b>Your line.</b> Chieftains age and die. Marry, and raise an heir to carry the saga on.</p>
<p><b>Saving.</b> The game autosaves every month. Use Menu for save slots and to export a save file.</p>`;

const TRAITS={
 bold:{n:'Bold',d:'His men fight with +10 morale and his charges hit harder. More likely to fall in battle.'},
 cautious:{n:'Cautious',d:'Keeps his men in hand: they take less harm, and he falls back before losses mount.'},
 shrewd:{n:'Shrewd',d:'Sells goods for 10% more at market.'},
 seafarer:{n:'Seafarer',d:'His fleet sails 12% faster and rides out winter gales better.'},
 cruel:{n:'Cruel',d:'Squeezes 20% more plunder from a raid, but the victims hate you more.'},
 beloved:{n:'Beloved',d:'His men will die for him: +15 morale. Slow to turn against you.'},
 greedy:{n:'Greedy',d:'His loyalty slips every month unless your treasury is fat or you give him gifts.'},
 ambitious:{n:'Ambitious',d:'Wants land and a name of his own. If his loyalty sinks he may turn on you.'},
 fierce:{n:'Fierce',d:'His warriors strike 12% harder.'},
 wise:{n:'Wise',d:'As a steward his holding yields 25% more, and he gives sound counsel.'},
};
const TRAIT_KEYS=Object.keys(TRAITS);
const MAX_CAPTS=6;
function rollTraits(){const a=pick(TRAIT_KEYS);let b=pick(TRAIT_KEYS);let n=0;while((b===a||(a==='bold'&&b==='cautious')||(a==='cautious'&&b==='bold')||(a==='beloved'&&b==='cruel')||(a==='cruel'&&b==='beloved'))&&n++<20)b=pick(TRAIT_KEYS);return[a,b];}
function newCaptain(o){o=o||{};const c={id:S.nextId++,name:o.name||pick(NAMES_M),nick:o.nick!=null?o.nick:pick(NICK),born:o.born||year()-ri(22,38),son:!!o.son,traits:o.traits||rollTraits(),loy:o.loy!=null?o.loy:58,xp:o.xp||0};S.capts.push(c);return c;}
const captById=id=>S.capts.find(c=>c.id===id);
const has=(c,t)=>!!c&&c.traits.includes(t);
function captName(c){return c.name+(c.nick?' '+c.nick:'');}
function captLvl(c){return c.xp>=12?3:c.xp>=5?2:1;}
function captFleet(c){return S.fleets.find(f=>f.capt===c.id)||null;}
function captHold(c){for(const id in S.sets)if(S.sets[id].stew===c.id&&S.sets[id].own==='player')return id;return null;}
function captFree(c){return!captFleet(c)&&!captHold(c);}
function captWhere(c){const f=captFleet(c);if(f)return`leads ${f.name}`;const h=captHold(c);if(h)return`steward of ${SET[h].name}`;return'in your hall';}
function fleetLeader(f){return f.chief?null:f.capt?captById(f.capt):null;}
function leaderLabel(f){if(f.chief)return rulerName(S.ruler);const c=fleetLeader(f);return c?captName(c):'a helmsman';}
function captBaseLoy(c){return(c.son?72:56)-(has(c,'ambitious')?10:0)+(has(c,'beloved')?8:0);}
function captainMorale(f){if(f.chief)return 10;const c=fleetLeader(f);if(!c)return-10;return captLvl(c)*5+(has(c,'beloved')?15:0)+(has(c,'bold')?10:0);}
function captMonthly(){for(const c of S.capts.slice()){const base=captBaseLoy(c);c.loy+=(base-c.loy)*.08;if(has(c,'greedy')&&S.res.silver<200)c.loy-=1.2;if(S.loyalty<30)c.loy-=1;c.loy=clamp(c.loy,0,100);
  if(c.loy<25&&!S.flags.captEv&&rnd()<(has(c,'ambitious')?.5:.2)){S.flags.captEv=1;queueEvent(()=>evCaptainDemand(c));}}}
function captYearly(){for(const k of S.kids){if(k.sex!=='m'||year()-k.born!==15)continue;if(S.capts.some(c=>c.son&&c.name===k.name&&c.born===k.born))continue;if(S.capts.length>=MAX_CAPTS)continue;const c=newCaptain({name:k.name,nick:'',born:k.born,son:true,loy:75});log(`${k.name}, your son, comes of age at fifteen and takes his place among your captains (${c.traits.map(t=>TRAITS[t].n).join(', ')}).`,'good');}
 for(const c of S.capts.slice()){const age=year()-c.born;const pd=age<45?.01:age<60?.04:.15;if(rnd()<pd)captDies(c,'dies of a fever in the winter dark');}}
function captDies(c,why){S.capts=S.capts.filter(x=>x!==c);for(const f of S.fleets)if(f.capt===c.id)f.capt=null;for(const id in S.sets)if(S.sets[id].stew===c.id)S.sets[id].stew=0;
 if(c.son)S.kids=S.kids.filter(k=>!(k.name===c.name&&k.born===c.born));log(`${captName(c)} ${why}.`,'war');toast(`${captName(c)} ${why}.`);sideDirty=true;}
function captGain(c,res){if(!c)return;c.xp+=res==='victory'?2:1;if(res==='victory')c.loy=clamp(c.loy+5,0,100);if(res==='defeat')c.loy=clamp(c.loy-6,0,100);}
function evCaptainDemand(c){S.flags.captEv=0;if(!S.capts.includes(c))return;const hold=captHold(c),fl=captFleet(c);const hs=holdings().filter(id=>!S.sets[id].trib);
 const threat=has(c,'ambitious')?(hold?`If you refuse, he may keep ${SET[hold].name} for himself.`:fl?`If you refuse, he may sail off with ${fl.name}.`:'If you refuse, he will leave and take men with him.'):'If you refuse, he will leave your hall.';
 showEvent(`${captName(c)} is restless`,`${captName(c)} stands up in your hall and says that a lord who keeps his captains poor will soon have none. He wants a greater share. ${threat}`,[
  {t:'Give him a rich gift (60 silver)',sub:'+35 loyalty.',dis:S.res.silver<60,fn:()=>{S.res.silver-=60;c.loy=clamp(c.loy+35,0,100);log(`You give ${captName(c)} a rich gift. He is satisfied, for now.`);}},
  {t:'Grant him a holding of his own',sub:hs.length?`He becomes jarl of ${SET[hold&&hs.includes(hold)?hold:hs[0]].name} under you. It yields half as much, but he will be loyal for years.`:'You hold no land to grant.',dis:!hs.length,fn:()=>{const id=hold&&hs.includes(hold)?hold:hs[0];const st=S.sets[id];st.stew=c.id;st.fief=1;c.loy=95;for(const f of S.fleets)if(f.capt===c.id)f.capt=null;log(`You grant ${SET[id].name} to ${captName(c)} as his jarldom.`,'hist');}},
  {t:'Refuse him',cls:'red',sub:threat,fn:()=>captBetrays(c)}],`<div class="evpic">${pimg(portraitOf('capt',c),'big')}</div>`);}
function captBetrays(c){const hold=captHold(c),fl=captFleet(c);
 if(has(c,'ambitious')&&hold){const st=S.sets[hold];st.own='ind';st.rel=-60;st.men=Math.round(st.gar*1.2+baseMen(SET[hold])*.5);st.gar=0;st.stew=0;st.trib=false;S.capts=S.capts.filter(x=>x!==c);log(`${captName(c)} declares himself lord of ${SET[hold].name} and shuts the gates against you!`,'war');toast(`${captName(c)} has rebelled at ${SET[hold].name}!`);addRenown(-15,'a captain\'s rebellion');return;}
 if(has(c,'ambitious')&&fl){const men=fleetMen(fl);for(const sh of fleetShips(fl))S.ships=S.ships.filter(x=>x!==sh);S.fleets=S.fleets.filter(x=>x!==fl);S.capts=S.capts.filter(x=>x!==c);log(`${captName(c)} turns his ships away. He sails off with ${men} of your men to become a sea-king.`,'war');toast(`${captName(c)} has deserted with his fleet!`);addRenown(-15,'a captain\'s desertion');
  return;}
 const n=Math.min(S.hird,Math.round(S.hird*(has(c,'beloved')?.25:.12)));S.hird-=n;S.capts=S.capts.filter(x=>x!==c);for(const id in S.sets)if(S.sets[id].stew===c.id)S.sets[id].stew=0;log(`${captName(c)} leaves your hall${n?` with ${n} hirdmen who follow him`:''}.`,'war');}
ACT.captgift=id=>{const c=captById(+id);if(!c||S.res.silver<25)return;S.res.silver-=25;c.loy=clamp(c.loy+15,0,100);log(`You give ${captName(c)} an arm-ring of gold.`);rerenderHall();};
ACT.captseek=()=>{if(S.capts.length>=MAX_CAPTS||S.res.silver<50)return;S.res.silver-=50;const c=newCaptain({loy:55});log(`${captName(c)} swears to be your man (${c.traits.map(t=>TRAITS[t].n).join(', ')}).`,'good');rerenderHall();};
ACT.captsteward=a=>{const[cid,id]=a.split(':');const c=captById(+cid);const st=S.sets[id];if(!c||!st||st.own!=='player'||st.trib)return;
 for(const k in S.sets)if(S.sets[k].stew===c.id)S.sets[k].stew=0;if(st.stew&&st.fief)return;st.stew=c.id;log(`${captName(c)} goes to ${SET[id].name} as your steward.`);closeModal();ACT.hall('hold');};
ACT.captrecall=id=>{const st=S.sets[id];if(!st||st.fief)return;const c=captById(st.stew);st.stew=0;if(c)log(`${captName(c)} returns to your hall from ${SET[id].name}.`);rerenderHall();};
ACT.stewpick=id=>{const free=S.capts.filter(captFree);showModal(`<h2>Steward for ${esc(SET[id].name)}</h2><p class="small">A steward rules the place in your name: +15% yield and +25% defence (more with the right traits). An ambitious steward with low loyalty may keep the place for himself.</p>${free.length?free.map(c=>`<button class="choice" data-act="captsteward" data-arg="${c.id}:${id}">${esc(captName(c))}<small>${c.traits.map(t=>esc(TRAITS[t].n)).join(', ')} · loyalty ${Math.round(c.loy)}</small></button>`).join(''):'<p><i>No captain is free. Captains who lead fleets or hold other places cannot go.</i></p>'}<div class="row"><button class="alt" data-act="hall" data-arg="hold">Back</button></div>`);};
function captainsHTML(){let h=`<h3>Captains (${S.capts.length}/${MAX_CAPTS})</h3><p class="small">Your sons (from age 15) and sworn men. Each fleet you send out needs a leader: you or a captain. A fleet with no captain fights at −10 morale. Captains gain experience in battle, and their traits shape how their men fight.</p>`;
 if(S.capts.length)h+=`<table class="t"><tr><th>Captain</th><th>Traits</th><th>Loyalty</th><th></th></tr>${S.capts.map(c=>`<tr><td>${pimg(portraitOf('capt',c),'sm')}<b>${esc(captName(c))}</b>${c.son?' <span class="pill">son</span>':''}<div class="small">age ${year()-c.born} · ${'★'.repeat(captLvl(c))} · ${esc(captWhere(c))}</div></td><td class="small">${c.traits.map(t=>`<b>${esc(TRAITS[t].n)}</b>: ${esc(TRAITS[t].d)}`).join('<br>')}</td><td><div class="bar" style="width:70px"><i style="width:${c.loy}%;background:${c.loy<30?'#9b2a1a':'#3f6b2e'}"></i></div><span class="small">${Math.round(c.loy)}</span></td><td><button class="sm" data-act="captgift" data-arg="${c.id}" ${S.res.silver<25?'disabled':''}>Gift (25)</button></td></tr>`).join('')}</table>`;
 else h+='<p><i>You have no captains. Only you can lead a fleet well.</i></p>';
 h+=`<button data-act="captseek" ${S.capts.length>=MAX_CAPTS||S.res.silver<50?'disabled':''}>Take a sworn man into your service (50 silver)</button>`;return h;}

 fields:{n:'Fields',icon:'🌾',d:'Clear and plough more land: +60% food at harvest.',cost:{timber:40,silver:20}},
 post:{n:'Trading post',icon:'◈',d:'Booths for passing traders: +80% silver at harvest (double that at a market town).',cost:{timber:50,silver:40}},

const specOf=id=>(S.sets[id]&&S.sets[id].spec)||[];
const hasSpec=(id,k)=>specOf(id).includes(k);
function specSlots(id){return S.sets[id].trib?0:SET[id].size;}
function holdYield(id){const s=SET[id],st=S.sets[id];const stew=captById(st.stew);let m=(st.trib?.5:1)*st.wealth*(st.fief?.5:1)*(stew&&!st.fief?1.15+(has(stew,'wise')?.25:0):1);
 const food=s.size*350*m*(hasSpec(id,'fields')?1.6:1);const silver=s.size*20*(s.kind==='market'?2.5:1)*m*(hasSpec(id,'post')?(s.kind==='market'?2.6:1.8):1);const timber=(st.trib?0:s.size*30)+(hasSpec(id,'sheds')?40:0);return{food,silver,timber};}
function holdDefMult(id){const st=S.sets[id];const stew=captById(st.stew);return(hasSpec(id,'fort')?1.6:1)*(stew?1.25+((has(stew,'bold')||has(stew,'fierce'))?.1:0):1);}
const specHird=()=>holdings().reduce((a,id)=>a+(hasSpec(id,'muster')?6*SET[id].size:0),0);
ACT.specpick=id=>{const st=S.sets[id];if(!st||st.own!=='player'||st.trib)return;const used=specOf(id);const free=specSlots(id)-used.length;
 showModal(`<h2>Develop ${esc(SET[id].name)}</h2><p class="small">${esc(KIND_N[SET[id].kind])}, size ${SET[id].size}: <b>${free}</b> of ${specSlots(id)} plots free. Each place can be shaped one way per plot, and once built it stays. Choose what this place is for.</p>${Object.keys(SPEC).map(k=>{const P=SPEC[k];const done=used.includes(k);return`<button class="choice ${done?'gold':''}" data-act="specbuild" data-arg="${id}:${k}" ${done||free<=0||!canAfford(P.cost)?'disabled':''}>${P.icon} ${esc(P.n)}${done?' (built)':''}<small>${esc(P.d)} Cost: ${esc(costStr(P.cost))}.</small></button>`;}).join('')}<div class="row"><button class="alt" data-act="hall" data-arg="hold">Back</button></div>`);};
ACT.specbuild=a=>{const[id,k]=a.split(':');const st=S.sets[id];if(!st||st.own!=='player'||st.trib||!SPEC[k])return;st.spec=st.spec||[];if(st.spec.includes(k)||st.spec.length>=specSlots(id)||!canAfford(SPEC[k].cost))return;pay(SPEC[k].cost);st.spec.push(k);log(`${SET[id].name}: your people build a ${SPEC[k].n.toLowerCase()}.`,'good');ACT.specpick(id);};

const RIVAL_SEATS={avald:[['alrek','Hordar'],['agdir','Egðir']],borre:[['borg','Vingulmark men'],['agdir','Egðir']],roden:[['hogom','Medelpad men'],['saltvik','Álanders']]};
const RIVAL_COL={rv1:'#8e4fb0',rv2:'#2f9c86'};
function setupRivals(){S.rivals={};const list=RIVAL_SEATS[S.home]||[];list.forEach(([seat,people],i)=>{const f='rv'+(i+1);const st=S.sets[seat];if(st.own!=='ind')return;st.own=f;st.orig=f;st.men=Math.max(55,Math.round(baseMen(SET[seat])*1.5));
  S.rivals[f]={name:pick(NAMES_M),nick:pick(NICK),born:year()-ri(28,40),seat,people,alive:true,friend:null,wins:0};S.facs[f]={rel:-10,griev:0,ally:false};});applyRivals();}
function applyRivals(){for(const f of['rv1','rv2']){const R=S.rivals&&S.rivals[f];if(!R){FACS[f].n='Rival jarl';FACS[f].ruler=[[0,'a rival jarl']];continue;}FACS[f].n=R.people;FACS[f].ruler=[[0,'Jarl '+R.name+(R.nick?' '+R.nick:'')]];}}
const rivalIds=()=>Object.keys(S.rivals||{}).filter(f=>S.rivals[f].alive);
function rivalPlaces(f){return SETS.filter(s=>S.sets[s.id].own===f).map(s=>s.id);}
function rivalSeatCheck(f,byPlayer){const R=S.rivals&&S.rivals[f];if(!R||!R.alive)return;const pl=rivalPlaces(f);if(S.sets[R.seat].own===f)return;
 if(pl.length){R.seat=pl.sort((a,b)=>SET[b].size-SET[a].size)[0];log(`Jarl ${R.name} flees and makes ${SET[R.seat].name} his new seat.`,'war');return;}
 R.alive=false;if(byPlayer)queueEvent(()=>evRivalFate(f));else log(`Jarl ${R.name} of the ${R.people} has lost his last hall and is gone from the land.`,'hist');}
function evRivalFate(f){const R=S.rivals[f];showEvent(`Jarl ${R.name} is in your hands`,`Your men drag Jarl ${R.name} ${R.nick} out of the ruins of his hall. His people are scattered and his ships are yours to burn. He stands before you bloodied but unbowed.`,[
 {t:'Put him to death',sub:'+20 renown. His kin and friends will remember.',cls:'red',fn:()=>{addRenown(20,`the death of Jarl ${R.name}`);if(R.friend&&S.facs[R.friend])S.facs[R.friend].griev+=1;log(`Jarl ${R.name} is put to death.`,'hist');}},
 {t:'Send him into exile',sub:'+8 renown. He sails away with a handful of men.',fn:()=>{addRenown(8,`driving out Jarl ${R.name}`);log(`Jarl ${R.name} sails into exile.`,'hist');}},
 {t:'Take his oath',sub:S.capts.length<MAX_CAPTS?'He becomes one of your captains: ambitious, and not to be trusted far.':'You have too many captains already.',dis:S.capts.length>=MAX_CAPTS,cls:'gold',fn:()=>{const c=newCaptain({name:R.name,nick:R.nick,born:R.born,traits:['ambitious',pick(['bold','fierce','seafarer','shrewd','cruel'])],loy:38,xp:6});addRenown(12,`Jarl ${R.name} bends the knee`);log(`Jarl ${R.name} kneels and swears to be your man.`,'hist');}}],`<div class="evpic">${pimg(portraitOf('rival',Object.assign({col:FACS[f].c},R)),'big')}</div>`);}
function rivalAnger(f){const R=S.rivals&&S.rivals[f];if(!R||!R.friend||!S.facs[R.friend])return;S.facs[R.friend].rel=clamp(S.facs[R.friend].rel-8,-100,100);if(rnd()<.5){S.facs[R.friend].griev++;log(`The ${FACS[R.friend].n} take up the cause of their kinsman Jarl ${R.name}.`,'war');}}
function rivalYearly(){const r=rank();for(const f of rivalIds()){const R=S.rivals[f],st=S.facs[f];
  if(r>=1&&!st.ally)st.rel=clamp(st.rel-2-r*2,-100,100);
  const seat=S.sets[R.seat];if(seat)seat.men=Math.round(seat.men+baseMen(SET[R.seat])*.25);
  if(!R.friend&&rnd()<.22){const big=['ves','lade','dan','svea','gaut'].filter(x=>S.facs[x]&&x!==S.home);const g=pick(big);if(g){R.friend=g;log(`Jarl ${R.name} of the ${R.people} marries a kinswoman of ${facRuler(g)}. The ${FACS[g].n} will stand by him.`,'war');}}
  if(year()-R.born>55&&rnd()<.2){const old=R.name;R.name=pick(NAMES_M);R.nick=pick(NICK);R.born=year()-ri(20,30);applyRivals();log(`Jarl ${old} of the ${R.people} dies. His son ${R.name} takes his seat${st.rel<0?' and swears to finish his father\'s feud':''}.`,'hist');if(st.rel<0)st.rel-=10;}}
 const live=rivalIds();if(r>=2&&live.length===2&&!S.flags.coalition&&live.every(f=>S.facs[f].rel<-20)){S.flags.coalition=1;log(`The ${S.rivals[live[0]].people} and the ${S.rivals[live[1]].people} swear an oath together against you. When one raids, the other will send ships.`,'hist');toast('Your rivals have allied against you!');}}
function rivalWarCheck(){if(!isSailSeason(doy()))return;
 // rivals and small powers try to take land from free chieftains and from each other
 const actors=[...rivalIds(),...['ves','lade','gaut','gut','dan','svea'].filter(f=>S.facs[f])];
 for(const f of actors){const isR=f.startsWith('rv');if(S.ai.some(a=>a.kind==='war'&&a.fac===f))continue;if(rnd()>(isR?.2:.05))continue;
  const mine=rivalPlaces(f);if(!mine.length||(isR&&mine.length>=6))continue;let best=null,bs=-1e9,src=null;
  for(const s of SETS){const st=S.sets[s.id];if(st.own===f||st.own==='player'||s.id===S.home)continue;if(FACS[st.own]&&FACS[st.own].big&&!isR)continue;if(!isR&&!st.own.startsWith('rv')&&st.own!=='ind')continue;
   for(const m of mine){const d=dist(SG[m].dock,SG[s.id].dock);if(d>(isR?380:260))continue;const sc=-d/60-st.men/4+(st.own.startsWith('rv')?-6:0)+s.size*4;if(sc>bs){bs=sc;best=s.id;src=m;}}}
  if(!best)continue;const avail=Math.round(S.sets[src].men*.65);const need=setDefense(best)*1.05;if(avail<need||avail<15)continue;
  const a=SG[src].dock,b=SG[best].dock;const p=findPath(a.x,a.y,b.x,b.y);if(!p)continue;S.sets[src].men-=avail;
  S.ai.push({id:S.nextId++,kind:'war',fac:f,src,target:best,x:a.x,y:a.y,path:p,ships:Math.ceil(avail/32),men:avail});
  if(S.sets[best].known||S.sets[src].known)log(`${isR?'Jarl '+S.rivals[f].name+' of the '+S.rivals[f].people:facRuler(f)} sends ${Math.ceil(avail/32)} ships against ${SET[best].name}.`,'war');}}
function warArrive(a){const id=a.target,st=S.sets[id];if(!st||st.own===a.fac)return;if(st.own==='player'){raidArrive(Object.assign({},a,{kind:'raid'}));return;}
 const D=setDefense(id),A=a.men*(.8+rnd()*.4);const known=st.known;const prev=st.own;
 if(A>D){st.own=a.fac;st.men=Math.round(a.men*.65);st.wealth*=.7;st.trib=false;if(a.fac.startsWith('rv'))S.rivals[a.fac].wins++;if(known)log(`${raidName(a)} take ${SET[id].name}.`,'war');if(prev.startsWith('rv'))rivalSeatCheck(prev,false);}
 else{st.men=Math.max(4,Math.round(st.men-a.men*.45));const back=Math.round(a.men*.4);if(a.src&&S.sets[a.src]&&S.sets[a.src].own===a.fac)S.sets[a.src].men+=back;if(known)log(`${raidName(a)} attack ${SET[id].name} but are thrown back.`,'');}}
function coalitionHelp(f){if(!S.flags.coalition||!f||!f.startsWith||!f.startsWith('rv'))return 0;const o=rivalIds().find(x=>x!==f);return o?Math.round(facPower(o)*.25):0;}
function rivalsCard(){const ids=rivalIds();if(!ids.length)return'';return`<div class="card"><h3>Rival jarls</h3>${ids.map(f=>{const R=S.rivals[f];const pl=rivalPlaces(f);return`<div class="fleetrow" data-act="selset" data-arg="${R.seat}"><span>${pimg(portraitOf('rival',Object.assign({col:FACS[f].c},R)),'xs')}<b style="color:${FACS[f].c}">■</b> Jarl ${esc(R.name)} ${esc(R.nick)}</span><span class="small">${pl.length} ${pl.length===1?'hall':'halls'} · ${facPower(f)} men · ${relWord(S.facs[f].rel)}${R.friend?` · friend of the ${esc(FACS[R.friend].n)}`:''}</span></div>`;}).join('')}${S.flags.coalition?'<div class="small" style="color:#9b2a1a">Sworn together against you.</div>':''}</div>`;}

function marrySeat(id){const st=S.sets[id];if(!st||id===S.home)return false;const o=st.own;if(o==='player')return false;
 if(o==='ind')return SET[id].kind==='seat';if(FACS[o]&&FACS[o].seat===id)return true;return!!(S.rivals&&S.rivals[o]&&S.rivals[o].alive&&S.rivals[o].seat===id);}
function marryBlock(id){const st=S.sets[id],o=st.own;const r=relOf(id);const king=o!=='ind'&&!String(o).startsWith('rv');
 if(king&&rank()<1)return'A king marries his kin only to a hersir or greater (150 renown).';
 if(r<20)return`Their mood toward you is ${relWord(r)} (${Math.round(r)}). It must be Friendly (20 or more): send gifts from the Peoples screen, feast them when you visit, and do not raid them.`;return'';}
function marryListHTML(){const L=SETS.filter(s=>marrySeat(s.id)&&(S.sets[s.id].known||S.sets[s.id].rumor));
 if(!L.length)return'<div class="small">Explore to find lords\' halls where you could seek a match.</div>';
 return`<div class="small" style="margin:6px 0 2px">Sail a fleet to one of these halls, go ashore and choose <b>Seek a marriage</b>. A match with a king\'s kin makes his people your allies; with a rival jarl, it ends his feud with you.</div><table class="t"><tr><th>Hall</th><th>Who</th><th>Mood</th><th></th></tr>${L.map(s=>{const st=S.sets[s.id];const why=marryBlock(s.id);return`<tr><td>${esc(s.name)}</td><td class="small">${esc(st.own==='ind'?'a free chieftain':facRuler(st.own))}</td><td class="small">${relWord(relOf(s.id))}${why?'<br><i>'+esc(why)+'</i>':' · <b>ready</b>'}</td><td><button class="sm alt" data-act="codexgo" data-arg="${s.id}">Show</button></td></tr>`;}).join('')}</table>`;}

/* ================= TOWN PICTURES ================= */
// A small painted scene for each place, drawn from what we know about it:
// size, kind, walls, owner, wealth, ships, and (for your home) your buildings.
const TOWNPIC={};
function seeded(seed){let s=seed>>>0||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function strHash(t){let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function townKey(id){const s=SET[id],st=S.sets[id];const home=id===S.home;const d=doy();const season=d<79||d>=320?'w':'s';

/* ================= ISOMETRIC BATTLEFIELD ================= */
// The battle simulation still runs on the flat 1000×600 field. Only the drawing changes:
// the field is seen from a 45° isometric camera (like the classic RTS games), with the
// ground painted under a skewed transform and upright things (people, houses, trees,
// stakes, ships) stamped in depth order so nearer ones cover farther ones.
const ISO_C=Math.SQRT1_2,ISO_W=(BW+BH)*ISO_C,ISO_H=(BW+BH)*ISO_C*.5,ISO_TOP=44;
// battle camera: zoom and pan like an RTS; the screen centre looks at field point (cx,cy)
function bcam(){if(!B.cam)B.cam={z:1.45,cx:(SHIPX+VC.x)/2+30,cy:BH/2};return B.cam;}
function isoFit(){const d=window.devicePixelRatio||1;const W=bcv.width/d,H=bcv.height/d;const base=Math.min(W/(ISO_W*.96),H/(ISO_H+ISO_TOP+8));const C=B?bcam():{z:1,cx:BW/2,cy:BH/2};const k=base*C.z;
 return{k,ox:W/2-(C.cx-C.cy)*ISO_C*k,oy:H/2-(C.cx+C.cy)*ISO_C*.5*k+ISO_TOP*k*.3,W,H,d};}
function clampBcam(){const C=bcam();C.z=clamp(C.z,1,3.2);C.cx=clamp(C.cx,SHIPX-40,BW-40);C.cy=clamp(C.cy,40,BH-40);}
function battleZoomAt(sx,sy,f){const before=screenToField(sx,sy);const C=bcam();C.z*=f;clampBcam();const after=screenToField(sx,sy);C.cx+=before.x-after.x;C.cy+=before.y-after.y;clampBcam();}

 for(let i=0;i<34;i++){const x=SHIPX+260+hash2(i,21)*(BW-SHIPX-280),y=30+hash2(i,23)*(BH-60);if(Math.hypot(x-VC.x,(y-VC.y)*1.2)<250)continue;if(T.river&&Math.abs(x-rivX(y))<30)continue;if(hash2(i,29)<.55)sc.trees.push({x,y,s:.7+hash2(i,31)*.4,pine:hash2(i,37)<.5});}

  for(const gx of[-1,1])for(const sy of[-1,1]){const a=gx<0?Math.PI-sy*GATE:sy*GATE;sc.stakes.push({x:VC.x+Math.cos(a)*WRX,y:VC.y+Math.sin(a)*WRY,h:16+B.wall*3,gate:true});}}

 for(let i=0;i<nShips;i++)sc.ships.push({x:SHIPX-30,y:BH/2+(i-(nShips-1)/2)*Math.min(105,520/nShips)});
 B.scene=sc;return sc;}

function rulerDies(why){if(S.flags.dying)return;S.flags.dying=1;const old=S.ruler,oldName=rulerName(old);const heir=heirOf();let txt;
 for(const f of S.fleets)f.chief=false;
 if(heir){const hc=S.capts.find(c=>c.son&&c.name===heir.name&&c.born===heir.born);if(hc){for(const f of S.fleets)if(f.capt===hc.id){f.capt=null;f.chief=true;}for(const id in S.sets)if(S.sets[id].stew===hc.id)S.sets[id].stew=0;S.capts=S.capts.filter(c=>c!==hc);}}
 for(const c of S.capts)if(!c.son)c.loy=clamp(c.loy-15,0,100);
 if(heir){const age=year()-heir.born;S.kids=S.kids.filter(k=>k!==heir);S.ruler={name:heir.name,nick:'',born:heir.born,sex:heir.sex,might:3,wit:3};S.spouse=null;S.generation++;
  const keep=age<14?.55:.78;S.renown=Math.round(S.renown*keep);S.loyalty=age<14?40:55;txt=`${oldName} ${why}. ${heir.name}, ${age<14?'a child of '+age:'aged '+age}, takes the high seat${age<14?'; kinsmen rule as regents until the heir comes of age':''}. Some renown dies with the old lord.`;}
 else{const m=rnd()<.8;S.ruler={name:pick(m?NAMES_M:NAMES_F),nick:'',born:year()-ri(22,34),sex:m?'m':'f',might:3,wit:3};S.spouse=null;S.kids=[];S.generation++;S.renown=Math.round(S.renown*.45);S.loyalty=40;
  txt=`${oldName} ${why}, leaving no child. After a bitter thing, a ${m?'nephew':'niece'}, ${S.ruler.name}, is chosen to hold the hall. Much of the family's fame is lost.`;}
 S.ruler.nick=rnd()<.5?pick(NICK):'';S.hist.push({y:year(),title:`Death of ${oldName}`,text:txt});log(txt,'hist');S.rankSeen=rank();
 setPaused(true);queueEvent(()=>{delete S.flags.dying;showEvent(`${oldName} is dead`,txt+' They laid the old lord in a ship under a mound, with weapons, a horse and a hound.',OK);});}

function discoverCheck(x,y,r){for(const s of SETS){const st=S.sets[s.id];if(st.known)continue;const g=SG[s.id];if(Math.hypot(g.x-x,g.y-y)>r+4)continue;if(!isExplored(g.x,g.y))continue;st.known=true;st.rumor=false;if(S.t>91){S.stats.discovered++;log(`Your lookouts sight ${s.name}: ${KIND_N[s.kind].toLowerCase()} of the ${FACS[s.fac].people}.`);addRenown(1,null);}sideDirty=true;}}

 if(f.men.hird+f.men.berserk+f.men.bondi+f.men.bow<5){toast('You need more warriors aboard to attack.');return;}
 showEvent(`Attack ${s.name}?`,`${relOf(id)>20?'They are friends to you now. An attack will turn them into enemies. ':''}The warband waits for your word.`,[
  {t:'Lead the attack',sub:'Command your warbands on the battlefield.',cls:'red',fn:()=>startRaid(f,id)},
  {t:'Let your captains fight it',sub:'The battle is fought quickly without you directing it.',fn:()=>{const st=S.sets[id];startRaidAuto(f,id);}},
  {t:'Think better of it'}]);};

function unpackExplored(p){const u=new Uint8Array(FW*FH);if(!p||!Array.isArray(p.r))return u;let v=p.f?1:0,k=0;for(const n0 of p.r){const n=Math.max(0,Math.floor(+n0||0));for(let i=0;i<n&&k<u.length;i++)u[k++]=v;v^=1;}return u;}

 n.kids=Array.isArray(o.kids)?o.kids.slice(0,12).map(k=>{const p=person(k);return{name:p.name,born:p.born,sex:p.sex};}):[];n.kin=str(o.kin,60,'your kin');n.generation=int(o.generation,1,99,1);
 n.res={food:num(o.res&&o.res.food,0,1e7,0),silver:num(o.res&&o.res.silver,0,1e7,0),timber:num(o.res&&o.res.timber,0,1e7,0),iron:num(o.res&&o.res.iron,0,1e7,0)};
 for(const k of['pop','thralls','hird','bow','berserk'])n[k]=num(o[k],0,1e5,0);n.pop=Math.max(5,n.pop);n.loyalty=num(o.loyalty,0,100,50);n.renown=num(o.renown,0,1e6,0);n.rankSeen=int(o.rankSeen,0,3,0);
