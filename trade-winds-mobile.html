<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Trade Winds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--wood:#2b1d12;--wood2:#4a3322;--wood3:#6b4a2e;--parch:#f4e8cb;--parch2:#e9d9b1;--parch3:#d8c28f;--ink:#2a1c0f;--ink2:#5e4a32;--gold:#c9a24a;--gold2:#e8c874;--red:#9b2d20;--green:#3d6b2a;--blue:#2b4a7a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#140d07;color:var(--ink);font-family:'EB Garamond',Georgia,serif;font-size:15px;overflow:hidden}
h1,h2,h3,h4{font-family:'IM Fell English SC',Georgia,serif;font-weight:400;margin:0}
button,input,select{font-family:inherit}
#app{display:grid;grid-template-rows:50px 1fr;height:100vh}
header{background:linear-gradient(#4a3322,#2b1d12);color:var(--parch);display:flex;align-items:center;gap:16px;padding:0 14px;border-bottom:2px solid var(--gold);white-space:nowrap;overflow:hidden}
.brand{font-family:'IM Fell English SC',serif;font-size:23px;color:var(--gold2);letter-spacing:.5px}
.brand span{font-size:14px;color:var(--parch3);opacity:.85}
.stat{font-size:15px}.stat b{color:var(--gold2);font-weight:600}
.spacer{flex:1}
.flagBtn{display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.25);border:1px solid var(--wood3);color:var(--parch);padding:3px 9px;border-radius:3px;cursor:pointer;font-size:14px}
.flagBtn:hover{border-color:var(--gold)}
.flagBtn img,.fimg{width:24px;height:16px;border:1px solid #0006;vertical-align:middle}
main{display:grid;grid-template-columns:1fr 320px;min-height:0}
#mapWrap{position:relative;min-width:0;overflow:hidden;background:#1b5574}
#map{width:100%;height:100%;display:block;cursor:grab}
#map.drag{cursor:grabbing}
aside{background:radial-gradient(ellipse at top,#f8eed6,#e8d6ab);overflow-y:auto;border-left:3px solid var(--wood2);padding:10px 12px}
aside section{margin-bottom:14px}
aside h3{font-size:17px;border-bottom:1px solid var(--parch3);margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
aside h3 small,.muted{font-family:'EB Garamond',serif;font-size:13px;color:var(--ink2)}
.ship{background:rgba(255,255,255,.35);border:1px solid var(--parch3);border-radius:4px;padding:6px 8px;margin-bottom:6px}
.ship .sn{font-weight:600}.ship .st{font-size:13px;color:var(--ink2)}
.tag{display:inline-block;font-size:11px;padding:0 5px;border-radius:8px;background:var(--wood2);color:var(--parch);vertical-align:middle;margin-left:4px;font-weight:400}
.tag.fast{background:#2b6a8a}.tag.fighter{background:#8a2b20}.tag.hauler{background:#6b5a1e}
.bar{height:6px;background:#0002;border-radius:3px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6f8f3a,#9bbf55)}
.bar.low i{background:linear-gradient(90deg,#9b2d20,#d0603c)}
.bar.mid i{background:linear-gradient(90deg,#b8862a,#e0b050)}
.bar.hold i{background:linear-gradient(90deg,#5a6f9a,#7f96c4)}
.cargoList{font-size:14px;display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.cargoList div{display:flex;justify-content:space-between}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;border:1px solid #0005}
.news{font-size:13.5px;line-height:1.35}
.news div{margin-bottom:5px;padding-left:8px;border-left:3px solid var(--parch3)}
.news .war{border-color:var(--red)}.news .storm{border-color:#51667f}.news .market{border-color:var(--gold)}.news .peace{border-color:var(--green)}
.news .d{color:var(--ink2);font-style:italic}
.rep{display:grid;grid-template-columns:28px 70px 1fr 34px;align-items:center;gap:4px;font-size:13px}
.repbar{height:6px;background:#0002;position:relative;border-radius:3px}
.repbar i{position:absolute;top:0;bottom:0;border-radius:3px}
.btn{background:linear-gradient(#5b3f27,#3a2717);color:var(--parch);border:1px solid var(--gold);border-radius:3px;padding:6px 12px;cursor:pointer;font-size:15px;line-height:1.2}
.btn:hover:not(:disabled){background:linear-gradient(#70502f,#4a321e);color:#fff}
.btn:disabled{opacity:.38;cursor:default}
.btn.sm{padding:3px 9px;font-size:14px}.btn.xs{padding:1px 6px;font-size:13px}
.btn.primary{background:linear-gradient(#b8862a,#8a6118);border-color:#f0d58a;color:#fff8e6}
.btn.primary:hover:not(:disabled){background:linear-gradient(#c9973a,#9a7128)}
.btn.danger{background:linear-gradient(#9b2d20,#6e1d14)}
.btn.on{background:linear-gradient(#b8862a,#8a6118)}
.btnRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#modalBg{position:fixed;inset:0;background:rgba(12,7,3,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modalBg.on{display:flex}
#modal{background:radial-gradient(ellipse at top,#faf1dc,#e8d6ab);border:3px solid var(--wood2);outline:1px solid var(--gold);outline-offset:-8px;border-radius:4px;box-shadow:0 12px 40px #000a;width:min(1000px,100%);max-height:94vh;overflow:auto;padding:18px 22px}
#modal.narrow{width:min(620px,100%)}
#modal.mid{width:min(800px,100%)}
#modal h2{font-size:28px;margin-bottom:6px}
#modal p{margin:8px 0;line-height:1.45}
.scene{width:100%;height:auto;border:2px solid var(--wood2);border-radius:3px;display:block;background:#123;margin:6px 0}
.odds{font-size:14px;color:var(--ink2);background:rgba(0,0,0,.05);padding:5px 8px;border-radius:3px}
.portHead{display:flex;gap:14px;align-items:center;border-bottom:2px solid var(--wood3);padding-bottom:10px}
.portHead img{width:54px;height:36px;border:1px solid #0007;box-shadow:0 2px 4px #0004}
.portHead .sub{font-size:14px;color:var(--ink2)}
.portHead .right{margin-left:auto;text-align:right;font-size:14px}
.portHead .right b{font-size:17px}
.tabs{display:flex;gap:4px;margin:10px 0 8px;flex-wrap:wrap}
.tabs button{background:transparent;border:1px solid var(--parch3);border-bottom:none;padding:5px 14px;font-family:'IM Fell English SC',serif;font-size:17px;cursor:pointer;color:var(--ink2);border-radius:4px 4px 0 0}
.tabs button.on{background:var(--wood2);color:var(--parch);border-color:var(--wood2)}
.tabs button .alert{color:#c0392b;font-weight:700}
.tabBody{min-height:320px}
table.mk{width:100%;border-collapse:collapse;font-size:14.5px}
table.mk th{font-family:'IM Fell English SC',serif;font-weight:400;text-align:left;border-bottom:1px solid var(--wood3);padding:4px;font-size:15px}
table.mk td{padding:3px 4px;border-bottom:1px solid #00000012;vertical-align:middle}
table.mk tr:hover td{background:rgba(255,255,255,.3)}
table.mk .num{text-align:right;font-variant-numeric:tabular-nums}
.cheap{color:#2c6a1a;font-weight:600}.dear{color:#a02a1c;font-weight:600}
.gain{color:#2c6a1a}.loss{color:#a02a1c}
.hint{font-size:12.5px;color:var(--ink2)}
.notice{padding:8px 12px;border-radius:4px;margin:6px 0;border-left:5px solid;line-height:1.4}
.notice.danger{background:#f3c9bd;border-color:#a02a1c}
.notice.warn{background:#f3e0b0;border-color:#b8862a}
.notice.info{background:#dde6ea;border-color:#51667f}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:rgba(255,255,255,.4);border:1px solid var(--parch3);border-radius:4px;padding:10px 12px}
.card h4{font-size:18px;margin-bottom:2px}
.kv{font-size:14px;color:var(--ink2)}
.kv b{color:var(--ink)}
details summary{cursor:pointer;color:var(--ink2);font-size:14px;margin-top:4px}
#mapHud{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(244,232,203,.95);border:2px solid var(--wood2);border-radius:5px;padding:8px 14px;box-shadow:0 4px 16px #0007;display:flex;gap:12px;align-items:center;max-width:calc(100% - 40px);font-size:15px}
#mapHud:empty{display:none}
#tip{position:absolute;pointer-events:none;background:rgba(244,232,203,.97);border:1px solid var(--wood2);border-radius:4px;padding:6px 9px;font-size:13.5px;box-shadow:0 3px 10px #0006;display:none;max-width:280px;z-index:5}
#tip h4{font-size:16px}
#zoomCtl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
#zoomCtl button{width:32px;height:32px;font-size:18px;padding:0}
#toasts{position:fixed;left:14px;top:62px;display:flex;flex-direction:column;gap:6px;z-index:60;pointer-events:none}
.toast{background:rgba(244,232,203,.97);border:1px solid var(--wood2);border-left:5px solid var(--gold);padding:7px 11px;border-radius:3px;box-shadow:0 3px 10px #0006;max-width:380px;font-size:14.5px;animation:tin .3s ease-out}
@keyframes tin{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.title h1{font-size:52px;color:var(--wood2);text-align:center;line-height:1}
.title .subt{text-align:center;font-style:italic;color:var(--ink2);margin-bottom:14px}
.slotRow{display:flex;align-items:center;gap:10px;border:1px solid var(--parch3);border-radius:4px;padding:8px 10px;margin:6px 0;background:rgba(255,255,255,.35)}
.slotRow .info{flex:1;font-size:14px}
label.fld{display:block;margin:8px 0 2px;font-size:14px;color:var(--ink2)}
input.txt,select.txt{width:100%;padding:6px 8px;border:1px solid var(--wood3);background:#fffaf0;border-radius:3px;font-size:15px}
.flagPick{display:flex;flex-wrap:wrap;gap:8px}
.flagPick button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px;min-width:110px}
.flagPick img{width:48px;height:32px}
.battleWrap{display:grid;grid-template-columns:1fr 250px;gap:12px}
.blog{font-size:13.5px;height:250px;overflow-y:auto;background:rgba(0,0,0,.05);padding:6px 8px;border-radius:3px;line-height:1.35}
.blog div{margin-bottom:3px}
.blog .p{color:#2c4f1a}.blog .e{color:#8a2415}.blog .i{color:var(--ink2);font-style:italic}
.bact{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.help p,.help li{font-size:15px;line-height:1.45}
.two{columns:2;column-gap:24px}

/* ================= iPhone layout ================= */
html{-webkit-text-size-adjust:100%}
html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,select{-webkit-user-select:text;user-select:text;font-size:16px}
body{position:fixed;inset:0}
#app{height:100%;grid-template-rows:auto 1fr;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);background:#2b1d12}
header{flex-wrap:wrap;height:auto;gap:4px 10px;padding:5px 10px;padding-top:calc(5px + env(safe-area-inset-top));white-space:normal}
.brand,.spacer{display:none}
.homeBtn{text-decoration:none}
.stat{font-size:13.5px;white-space:nowrap}
#hRank{flex:1 1 140px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
header .btn.sm{padding:5px 9px;font-size:13.5px}
.flagBtn{padding:3px 7px;font-size:13px}
main{grid-template-columns:1fr;grid-template-rows:1fr clamp(150px,32%,280px)}
#map{touch-action:none}
aside{border-left:none;border-top:3px solid var(--wood2);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
aside h3{font-size:16px}
#mapHud{left:8px;right:8px;bottom:8px;transform:none;max-width:none;flex-wrap:wrap;gap:6px;padding:6px 9px;font-size:13.5px}
#mapHud span{flex:1 1 100%}
#zoomCtl button{width:40px;height:40px;font-size:20px}
#tip{max-width:250px;font-size:13px}
#toasts{left:8px;right:8px;top:calc(env(safe-area-inset-top) + 76px)}
.toast{max-width:none;font-size:13.5px}
#modalBg{padding:0;align-items:stretch}
#modal,#modal.narrow,#modal.mid{width:100%;max-height:none;height:100%;border-radius:0;outline:none;border:none;
  padding:calc(10px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
#modal h2{font-size:23px}
.title h1{font-size:40px}
.portHead{flex-wrap:wrap;gap:8px 12px}
.portHead img{width:42px;height:28px}
.portHead h2{font-size:23px}
.portHead .right{margin-left:0;width:100%;text-align:left}
.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;padding:7px 11px;font-size:15.5px}
.btn{padding:8px 12px}
.btn.sm{padding:7px 11px}
.btn.xs{padding:6px 10px;font-size:14px;min-height:32px}
.btnRow{gap:7px}
.grid2,.two{grid-template-columns:1fr;columns:1}
.flagPick button{min-width:92px}
.slotRow{flex-wrap:wrap}
details summary{padding:6px 0}
/* wide tables scroll sideways */
table.mk{display:block;overflow-x:auto;white-space:nowrap}
table.mk .hint{white-space:normal;min-width:170px}
/* market and factory tables become one card per good */
table.market,table.factory{display:block;white-space:normal;overflow:visible}
table.market tbody,table.factory tbody{display:block}
table.market tr,table.factory tr{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 10px;align-items:center;padding:8px 2px;border-bottom:1px solid #00000022}
table.market tr:first-child,table.factory tr:first-child{display:none}
table.market td,table.factory td,table.market td.num,table.factory td.num{border:none;padding:0;text-align:left}
.portFoot{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));margin:10px calc(-1 * max(12px,env(safe-area-inset-left))) calc(-16px - env(safe-area-inset-bottom));padding:8px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#ead9b0 30%);z-index:2}
.portFoot .btn{flex:1}
table.market td:nth-child(1),table.factory td:nth-child(1){grid-column:1;grid-row:1;font-weight:600}
table.market td:nth-child(2){grid-column:2;grid-row:1}
table.market td:nth-child(3){grid-column:3;grid-row:1}
table.market td:nth-child(5){grid-column:4;grid-row:1}
table.market td:nth-child(7){grid-column:1/3;grid-row:2}
table.market td:nth-child(8){grid-column:3/5;grid-row:2;justify-self:end}
table.market td:nth-child(4){grid-column:1;grid-row:3;font-size:12.5px;color:var(--ink2)}
table.market td:nth-child(6){grid-column:2/5;grid-row:3;justify-self:end;font-size:12.5px}
table.market td:nth-child(9){grid-column:1/5;grid-row:4}
table.market td:nth-child(2)::before{content:'Buy ';font-weight:400;color:var(--ink2);font-size:12.5px}
table.market td:nth-child(3)::before{content:'Sell ';font-weight:400;color:var(--ink2);font-size:12.5px}
table.market td:nth-child(4)::before{content:'In port '}
table.market td:nth-child(5)::before{content:'Hold ';color:var(--ink2);font-size:12.5px}
table.market td:nth-child(6):not(:empty)::before{content:'Paid ';color:var(--ink2)}
table.market td:nth-child(9):empty,table.market td:nth-child(6):empty{display:none}
table.factory td:nth-child(2){grid-column:2;grid-row:1}
table.factory td:nth-child(3){grid-column:3;grid-row:1}
table.factory td:nth-child(4){grid-column:4;grid-row:1}
table.factory td:nth-child(5){grid-column:1/3;grid-row:2}
table.factory td:nth-child(6){grid-column:3/5;grid-row:2;justify-self:end}
table.factory td:nth-child(7){grid-column:1/5;grid-row:3;justify-self:end}
table.factory td:nth-child(2)::before{content:'Stored ';color:var(--ink2);font-size:12.5px}
table.factory td:nth-child(3)::before{content:'Hold ';color:var(--ink2);font-size:12.5px}
table.factory td:nth-child(4)::before{content:'Sells ';color:var(--ink2);font-size:12.5px}
table.factory td:nth-child(5)::before{content:'Load ';color:var(--ink2);font-size:12.5px}
table.factory td:nth-child(6)::before{content:'Store ';color:var(--ink2);font-size:12.5px}
/* battles stack vertically */
.battleWrap{grid-template-columns:1fr;gap:6px}
.blog{height:min(30vh,240px);font-size:13px}
@media (orientation:portrait){ .battleWrap .scene + .hint::after{content:' Turn your phone sideways for a bigger view.';font-weight:600} }
.bact{gap:7px}
.scene{margin:4px 0}
/* landscape phone: chart left, panel right, everything compact */
@media (orientation:landscape) and (max-height:540px){
  header{flex-wrap:nowrap;padding-top:4px;padding-bottom:4px;gap:8px}
  #hRank{display:none}
  main{grid-template-columns:1fr calc(260px + env(safe-area-inset-right));grid-template-rows:1fr}
  #app{padding-right:0}
  aside{border-top:none;border-left:3px solid var(--wood2);padding-right:calc(10px + env(safe-area-inset-right))}
  #toasts{top:52px;left:calc(8px + env(safe-area-inset-left));right:auto;width:min(380px,60vw)}
  .battleWrap{grid-template-columns:1fr 230px}
  .blog{height:170px}
  #mapHud span{flex:1 1 auto}
}
</style>

<script>
'use strict';
/* =====================================================================
   TRADE WINDS — a Caribbean trading game, c. 1680

   SAVE COMPATIBILITY (read this before changing the game):
   - A save holds only the player's state: gold, fleet, cargo, flags,
     reputation, market stock levels, hurricanes, news. Ship stats, goods,
     ports and prices come from the DATA tables below, so you can rebalance
     them freely and existing saves pick up the new numbers.
   - Adding a new port / good / ship type / refit: nothing else to do.
     normalizeSave() fills in anything an older save is missing.
   - Renaming or deleting an existing id (e.g. a good's id): bump
     SAVE_VERSION and add a MIGRATIONS entry that converts old saves.
   ===================================================================== */
const SAVE_VERSION = 2;
const MIGRATIONS = {
  // Each entry converts a save of that version into the next one.
  1: s => { s.start = s.start || '1680-03-01'; return s; }, // v2 added piracy, privateers, factories, conquest, historical wars
};

// ---------------------------------------------------------------- utils
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function aAn(w) { return /^[aeiou]/i.test(w) ? 'an ' + w : 'a ' + w; }
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function gameDate(day) { const [y, m, dd] = ((typeof S !== 'undefined' && S && S.start) || '1680-03-01').split('-').map(Number); const d = new Date(y, m - 1, dd); d.setDate(d.getDate() + day); return d; }
function isoDate(day) { const d = gameDate(day); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function dateStr(day) { const d = gameDate(day); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function shortDate(day) { const d = gameDate(day); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`; }

// Map is an equirectangular chart. Land outlines are hand-traced lon/lat.
const LON0 = -98, LON1 = -57, LAT0 = 7, LAT1 = 31;
const KX = Math.cos(20 * Math.PI / 180);
const PPD = 40; // world pixels per degree of latitude
const WORLD_W = (LON1 - LON0) * KX * PPD, WORLD_H = (LAT1 - LAT0) * PPD;

function fortStats(pid) { const p = PORT[pid], m = FORT_MULT[pid] || 1, guns = Math.round(p.size * 18 * m); return { guns, hp: guns * 11, garrison: Math.round(p.size * 100 * m) }; }

      <button class="btn primary" data-act="siegeopt" data-o="hold" ${S.gold >= gc ? '' : 'disabled'}>Hold it as your own — leave a garrison (${fmt(gc)}). Its plantations will sell to you for half price or less.</button>
      ${legal ? `<button class="btn" data-act="siegeopt" data-o="cede">Hand it to ${NATIONS[S.flag].name} — a reward of ${fmt(p.size * 5000)} and great favour with the crown.</button>` : ''}
    </div>`;
}
function siegeOption(opt) {
  const B = battle, pid = B.siege, p = PORT[pid], o = B.enemies[0].nation, legal = B.legal[o];
  if (opt === 'sack') {
    let gold = B.siegeLoot; const crown = legal ? Math.round(gold * 0.1) : 0; gold -= crown; S.gold += gold;
    const got = [];
    for (const g of p.prod) { const m = S.markets[pid][g], q = Math.min(Math.floor(m.s * 0.6), freeHold()); if (q > 0) { m.s -= q; const had = S.cargo[g] || 0; addCargo(g, q); S.cost[g] = ((S.cost[g] || 0) * had) / (had + q); got.push(`${q} ${GOOD[g].name.toLowerCase()}`); } }
    for (const g of GOODS) { S.markets[pid][g.id].m = 0.4; S.markets[pid][g.id].s *= 0.4; }
    S.sacked[pid] = S.day; S.stats.townsSacked++;
    repChange(o, -20); if (legal) repChange(S.flag, 10); else gainInfamy(15, `the sack of ${p.name}`);
    news(`${p.name} has been sacked by Captain ${S.captain}! The town is in ruins and prices there have soared.`, 'war');
    B.decided = `You sack ${p.name}: <b>${fmt(gold)}</b> gold${crown ? ` (the crown takes ${fmt(crown)})` : ''}${got.length ? ' and ' + got.join(', ') : ''}. You sail away before help arrives.`;
  } else if (opt === 'hold') {
    const gc = 2000 * p.size; if (S.gold < gc) return; S.gold -= gc;
    S.owners[pid] = 'player'; S.holdings[pid] = { day: S.day, fort: 1, prev: o };
    repChange(o, -20); if (!legal) gainInfamy(10, `seizing ${p.name}`);

    B.decided = `Your banner flies over ${p.name}. Its plantations now sell to you at half price, the port is always open to you, and its taxes are yours. Strengthen its defences at the Residence: the ${NATIONS[o].adj} will try to take it back.`;
    B.enterAfter = pid;
  } else if (opt === 'cede') {

// Save files: plain JSON (never executed), wrapped with a SHA-256 fingerprint so a file that was
// damaged or edited after export is flagged on import. The fingerprint detects accidents and
// casual edits; the real protection against a crafted file is sanitizeSave(), which every
// imported or stored save goes through before use.

  const blob = new Blob([JSON.stringify(file, null, 1)], { type: 'application/json' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `trade-winds-${String(s.captain || 'captain').replace(/[^\w-]+/g, '_').slice(0, 24)}-day${int(s.day, 0, 0, 1e6)}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);

        if (want && got && want !== got && !confirm('This save file has been changed since it was exported, or it is damaged.\n\nImport it anyway? (The game checks every value before using it.)')) return;
        if (!want) note = ' (no fingerprint to check)';

    const r = cvs.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, p = portAt(mx, my), gr = p ? null : groundAt(mx, my), sh = p || gr ? null : shipAt(mx, my);
    if (gr && !UI.wait && S.station !== gr.id) planRoute(gr.id);
    else if (sh && !UI.wait) { if (interceptRange(sh)) { UI.plan = null; if (S.voyage) UI.paused = false; intercept(sh); UI.hoverShip = null; } else toast(S.port ? 'Put to sea first, then chase ships that pass close by.' : 'She is too far off to chase. Get closer.'); }
    else if (p) {
      if (UI.wait) { /* ignore while waiting */ }
      else if (S.port === p.id) openPort();
      else if (!S.voyage && !S.port && S.anchoredOff === p.id) { const a = portAccess(p.id); if (a.open) enterPort(p.id); else showClosed(p.id, a); }
      else planRoute(p.id);
    }
  }
  drag = null; cvs.classList.remove('drag');
});
cvs.addEventListener('mouseleave', () => { UI.hover = null; $('#tip').style.display = 'none'; });
cvs.addEventListener('wheel', e => {
  e.preventDefault(); const r = cvs.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, [wx, wy] = s2w(mx, my);
  cam.z *= e.deltaY < 0 ? 1.15 : 1 / 1.15; clampCam(); const [sx, sy] = w2s(wx, wy); cam.x += (sx - mx) / cam.z; cam.y += (sy - my) / cam.z; clampCam(); followHold = T + 4;
}, { passive: false });
$('#zIn').addEventListener('click', () => { cam.z *= 1.3; clampCam(); });
$('#zOut').addEventListener('click', () => { cam.z /= 1.3; clampCam(); });
$('#zHome').addEventListener('click', () => { if (S) { followHold = 0; centerOn(S.pos[0], S.pos[1]); } });
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(() => resize()).observe($('#mapWrap'));
window.addEventListener('orientationchange', () => { [100, 350, 900].forEach(ms => setTimeout(() => { window.scrollTo(0, 0); resize(); }, ms)); });

// ---------------------------------------------------------------- AMBIENT TRAFFIC (cosmetic)
function newAmbient() {
  const a = pick(PORTS), b = pick(PORTS.filter(p => p !== a)), path = routeBetweenPorts(a.id, b.id); if (!path) return { path: null };
  const owner = S ? nat(a) : a.n, n = NAVY_NATIONS.includes(owner) ? owner : pick(NAVY_NATIONS);
  const pir = chance(0.14), navy = !pir && chance(0.35);
  return { path, seg: 0, segT: 0, pos: path[0].slice(), ang: 0, spd: rand(0.3, 0.55), ph: Math.random() * 6, kind: pir ? 'pirate' : navy ? 'navy' : 'merchant', nation: n, col: pir ? '#111' : NATIONS[n].color, hull: pir ? '#222' : navy ? '#4a2e18' : '#7a5530' };
}
function initAmbient() { AMBIENT.length = 0; for (let i = 0; i < 9; i++) { const a = newAmbient(); if (a.path) { const skip = randi(0, a.path.length - 2); a.seg = skip; a.pos = a.path[skip].slice(); } AMBIENT.push(a); } }
function updateAmbient(dt) {
  const k = S && S.voyage && !UI.paused && !blocked() ? S.settings.speed : 0.35;
  for (let i = 0; i < AMBIENT.length; i++) {
    const a = AMBIENT[i]; if (!a.path) { AMBIENT[i] = newAmbient(); continue; }
    let move = a.spd * dt * k;
    while (move > 0 && a.seg < a.path.length - 1) { const p = a.path[a.seg], q = a.path[a.seg + 1], L = dist(p[0], p[1], q[0], q[1]), rem = L - a.segT; if (move >= rem) { a.seg++; a.segT = 0; move -= rem; } else { a.segT += move; move = 0; } }
    if (a.seg >= a.path.length - 1) { AMBIENT[i] = newAmbient(); continue; }
    const p = a.path[a.seg], q = a.path[a.seg + 1], L = dist(p[0], p[1], q[0], q[1]) || 1; a.pos = [lerp(p[0], q[0], a.segT / L), lerp(p[1], q[1], a.segT / L)];
    const [px, py] = proj(p[0], p[1]), [qx, qy] = proj(q[0], q[1]); a.ang = angLerp(a.ang, Math.atan2(qy - py, qx - px), Math.min(1, dt * 3));
  }
}

// ---------------------------------------------------------------- MAIN LOOP
function update(dt) {
  updateAmbient(dt);
  if (!S) return;
  if (APPROACH) { APPROACH.t += dt; if (APPROACH.t >= APPROACH.dur + 0.25) { const ev = APPROACH.ev; APPROACH = null; ev.show(); } return; }
  if (modalOpen) return;
  if (EVQ.length) { pumpEvents(); return; }
  if (S.voyage) {
    if (S.voyage.arrived) { arrive(); return; }
    if (!UI.paused && !UI.plan) advanceVoyage(dt);
    if (S.settings.follow && T > followHold && cam.z > zFit() * 1.05) { const [x, y] = proj(S.pos[0], S.pos[1]); cam.x += (x - cam.x) * Math.min(1, dt * 1.5); cam.y += (y - cam.y) * Math.min(1, dt * 1.5); clampCam(); }
  } else if (UI.wait) advanceWait(dt);
}
let lastT = performance.now(), hudTick = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; T += dt;
  try {
    update(dt); drawMap(dt); if (scene) scene.draw(dt);
    hudTick += dt; if (hudTick > 0.5 && S && S.voyage && !modalOpen) { hudTick = 0; renderHud(); }
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
function init() {
  buildNav(); resize(); buildBaseMap(); initAmbient();
  cam.z = zFit(); clampCam();
  requestAnimationFrame(frame);
  showTitle();
}
// ---------------------------------------------------------------- iPHONE TOUCH LAYER
// One document-level handler routes every touch. Coordinates are corrected by the
// visualViewport offset (iOS leaves it non-zero after rotating, so taps would land
// below the finger). The chart gets pan / pinch / tap; taps on the chart are replayed
// as mouse events so the desktop click logic runs unchanged. Quick taps on buttons are
// pressed directly; anything else (scrolling a pane) is left to iOS.
(function () {
  const vv = window.visualViewport;
  const pt = t => [t.clientX - (vv ? vv.offsetLeft : 0), t.clientY - (vv ? vv.offsetTop : 0)];
  let mode = null, start = null, last = null, pinch = null, tipTimer = 0, lastTap = null;
  const mouse = (type, x, y) => cvs.dispatchEvent(new MouseEvent(type, { clientX: x, clientY: y, bubbles: true, cancelable: true, view: window }));
  function tapMap(x, y) {
    const r = cvs.getBoundingClientRect(), mx = x - r.left, my = y - r.top;
    const target = portAt(mx, my) || groundAt(mx, my) || shipAt(mx, my);
    // First tap on something shows its card (and plans a course to ports/grounds, which is harmless).
    // A ship needs a second tap on the same ship to give chase.
    mouse('mousemove', x, y);
    clearTimeout(tipTimer); tipTimer = setTimeout(() => { $('#tip').style.display = 'none'; UI.hoverShip = null; }, 5000);
    const isShip = target && target.path;
    if (isShip && !(lastTap && lastTap.target === target && performance.now() - lastTap.t < 6000)) { lastTap = { target, t: performance.now() }; return; }
    lastTap = { target, t: performance.now() };
    mouse('mousedown', x, y); mouse('mouseup', x, y);
  }
  document.addEventListener('touchstart', e => {
    if (e.touches.length === 2 && mode === 'map') {
      const a = pt(e.touches[0]), b = pt(e.touches[1]);
      pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, z: cam.z, cx: (a[0] + b[0]) / 2, cy: (a[1] + b[1]) / 2 };
      start.moved = true; e.preventDefault(); return;
    }
    if (e.touches.length > 1) return;
    const [x, y] = pt(e.touches[0]), el = document.elementFromPoint(x, y);
    start = { x, y, t: performance.now(), el, moved: false }; last = { x, y };
    if (el === cvs) { mode = 'map'; e.preventDefault(); followHold = T + 4; $('#tip').style.display = 'none'; return; }
    mode = 'ui';
  }, { passive: false });
  document.addEventListener('touchmove', e => {
    if (mode !== 'map' || !start) return; e.preventDefault();
    if (e.touches.length === 2 && pinch) {
      const a = pt(e.touches[0]), b = pt(e.touches[1]), d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      const r = cvs.getBoundingClientRect(), mx = pinch.cx - r.left, my = pinch.cy - r.top, [wx, wy] = s2w(mx, my);
      cam.z = pinch.z * d / pinch.d; clampCam(); const [sx, sy] = w2s(wx, wy); cam.x += (sx - mx) / cam.z; cam.y += (sy - my) / cam.z; clampCam();
      followHold = T + 4; return;
    }
    const [x, y] = pt(e.touches[0]), dx = x - last.x, dy = y - last.y; last = { x, y };
    if (Math.hypot(x - start.x, y - start.y) > 10) start.moved = true;
    if (start.moved) { cam.x -= dx / cam.z; cam.y -= dy / cam.z; clampCam(); followHold = T + 4; }
  }, { passive: false });
  document.addEventListener('touchend', e => {
    if (!start) return;
    const [x, y] = pt(e.changedTouches[0]);
    const quick = !start.moved && performance.now() - start.t < 650 && Math.hypot(x - start.x, y - start.y) < 12;
    if (mode === 'map') {
      e.preventDefault();
      if (e.touches.length === 1) { pinch = null; last = pt(e.touches[0]); return; } // keep panning with the remaining finger
      if (e.touches.length === 0) { if (quick && S && !blocked()) tapMap(x, y); mode = null; start = null; pinch = null; }
      return;
    }
    if (mode === 'ui' && quick && e.touches.length === 0 && start.el && start.el.closest) {
      const el = start.el.closest('#bcv, button, a[href], summary, [data-act], [data-hud]');
      if (el && el.id === 'bcv') { e.preventDefault(); battleClick({ clientX: x, clientY: y }); }
      else if (el && !el.disabled) { e.preventDefault(); el.click(); }
    }
    mode = null; start = null;
  }, { passive: false });
  document.addEventListener('touchcancel', () => { mode = null; start = null; pinch = null; });
  document.addEventListener('gesturestart', e => e.preventDefault()); // no Safari page zoom
})();
init();
</script>
