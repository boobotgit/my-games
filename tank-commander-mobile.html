    if (!player.alive && state === 'play') {
      ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
      if (lives > 0) banner('TANK DESTROYED', ['Reserve tank rolling out…'], '#ff6a4a');
      else banner('OUT OF TANKS', [ally && ally.alive ? 'Your partner fights on — cheer them on!' : ''], '#ff6a4a');
    }
    drawMinimap();
    drawHUD();
    const next = net.role === 'guest' ? 'Waiting for the host…' : net.role === 'host' && ally ? 'Tap to play again together' : 'Tap to continue';
    if (state === 'clear') banner('STAGE ' + (level + 1) + ' CLEAR', ['Score ' + score, bonusTank ? '+1 TANK!' : ''], '#9ef08a');
    if (state === 'over') banner('GAME OVER', [hqAlive ? 'Your tanks were destroyed.' : 'The eagle HQ was destroyed!', 'Score ' + score, stateT > 1 ? next : ''], '#ff6a4a');
    if (state === 'win') banner('VICTORY!', ['All ' + LEVELS.length + ' stages held.', 'Score ' + score, next], '#f0c040');
  }

  // ═════════════════════════════════════════════════════════════════════════
  //  2-PLAYER CO-OP (phone ↔ phone over the internet)
  // ═════════════════════════════════════════════════════════════════════════
  // How it connects
  //   The two phones talk DIRECTLY to each other (WebRTC data channel). There is no game
  //   server and no matchmaking server. To set up the link, the players swap two codes by
  //   text message: the host's "invite" and the partner's "reply". The only outside machine
  //   involved is a public STUN server (Google / Cloudflare), which just tells each phone its
  //   own public internet address so the phones can find each other. It never sees or relays
  //   any game data, and no code is ever loaded from it (or from anywhere).
  //
  // Security model
  //   1. Encrypted: WebRTC encrypts everything (DTLS) between the two phones.
  //   2. Safety code: once linked, both phones show 4 symbols computed from BOTH phones'
  //      encryption-key fingerprints. If anyone tampered with the codes on the way, the
  //      symbols differ — play only starts after both players confirm they match.
  //   3. Nothing executable crosses the link: no chat, names, links, files or HTML. Only
  //      small JSON packets of numbers in a fixed format. Every packet is size-limited,
  //      rate-limited and checked field by field (type, range, length); anything unexpected
  //      is dropped, and a partner that keeps sending junk is disconnected. Received data is
  //      only ever drawn on the canvas — never put into the page as HTML.
  //   4. The host runs the battle. The partner can only drive its own tank (speed- and
  //      wall-checked by the host) and ask to fire (the host enforces the reload time).
  //   5. Invite/reply codes are checked before use: strict format, size caps (also after
  //      decompression), and the connection description inside must be a data-only link
  //      with an encryption fingerprint — no audio, video, camera or microphone.
  //   6. The page's Content-Security-Policy forbids loading or fetching anything from the web.
  const STUN = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }];
  const net = { role: null, pc: null, dc: null, open: false, okSelf: false, okPeer: false,
                lastRx: 0, lastTx: 0, sendAcc: 0, bucket: 120, strikes: 0, gen: 0, playing: false,
                lastRs: -1, lastHp: 3, lastAlive: true, lastState: '' };
  const coopEl = id => document.getElementById(id);
  const ui = {
    panel: coopEl('coop'), msg: coopEl('cMsg'), outBox: coopEl('cOutBox'), out: coopEl('cOut'),
    inBox: coopEl('cInBox'), inp: coopEl('cIn'), go: coopEl('cGo'), safe: coopEl('cSafe'),
    emoji: coopEl('cEmoji'), choose: coopEl('cChoose'),
  };
  function coopShow(step, msg, isErr) {
    ui.panel.hidden = false;
    ui.msg.textContent = msg || '';
    ui.msg.classList.toggle('err', !!isErr);
    ui.choose.hidden = step !== 'choose';
    ui.outBox.hidden = !(step === 'host-invite' || step === 'join-reply');
    ui.inBox.hidden = !(step === 'host-invite' || step === 'join-paste');
    ui.safe.hidden = step !== 'safety';
    ui.go.textContent = step === 'join-paste' ? 'Make reply code' : 'Connect';
    ui.go.disabled = false;
  }
  function coopHide() { ui.panel.hidden = true; unscroll(); releaseAllControls(); }

  // ── invite / reply codes ──
  // "TC1." + base64url(deflate(JSON {v:1, k:'o'|'a', s:<connection description>}))
  const MAX_CODE_CHARS = 9000, MAX_JSON_BYTES = 24000, MAX_SDP = 16000;
  function b64urlEncode(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function b64urlDecode(str) {
    const b64 = str.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - str.length % 4) % 4);
    const bin = atob(b64), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  const canZip = typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';
  async function zip(text) {
    const st = new Blob([text]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(st).arrayBuffer());
  }
  async function unzipCapped(bytes, cap) {
    const reader = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')).getReader();
    const parts = []; let total = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      total += value.length;
      if (total > cap) { try { reader.cancel(); } catch (e) {} throw new Error('size'); }   // "zip bomb" guard
      parts.push(value);
    }
    const all = new Uint8Array(total); let o = 0;
    for (const p of parts) { all.set(p, o); o += p.length; }
    return all;
  }
  async function encodeCode(kind, sdp) {
    const json = JSON.stringify({ v: 1, k: kind, s: sdp });
    if (canZip) return 'TC1.' + b64urlEncode(await zip(json));
    return 'TC1u.' + b64urlEncode(new TextEncoder().encode(json));
  }
  const FP_RE = /^a=fingerprint:sha-256 ((?:[0-9A-F]{2}:){31}[0-9A-F]{2})\r?$/mi;
  function sdpLooksSafe(s) {
    return typeof s === 'string' && s.length > 50 && s.length <= MAX_SDP &&
      /^[\x20-\x7e\r\n]*$/.test(s) &&          // plain printable text only
      s.startsWith('v=0') &&
      (s.match(/^m=/gm) || []).length === 1 && // exactly one connection section...
      /^m=application /m.test(s) &&            // ...which is a data link —
      !/^m=(audio|video)/m.test(s) &&          // never camera / microphone
      FP_RE.test(s);                           // with an encryption fingerprint
  }
  async function decodeCode(text, want) {
    const raw = String(text || '').replace(/\s+/g, '');
    if (!raw) throw new Error('Paste the code first.');
    if (raw.length > MAX_CODE_CHARS) throw new Error('That code is too long to be a Tank Commander code.');
    const m = /^TC1(u?)\.([A-Za-z0-9_-]{20,})$/.exec(raw);
    if (!m) throw new Error("That doesn't look like a Tank Commander code. Copy the whole thing and try again.");
    let obj;
    try {
      const bytes = b64urlDecode(m[2]);
      const plain = m[1] ? bytes : await unzipCapped(bytes, MAX_JSON_BYTES);
      if (plain.length > MAX_JSON_BYTES) throw new Error('size');
      obj = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(plain));
    } catch (e) { throw new Error('That code is damaged or incomplete. Copy the whole thing and try again.'); }
    if (!obj || typeof obj !== 'object' || obj.v !== 1 || (obj.k !== 'o' && obj.k !== 'a'))
      throw new Error("That doesn't look like a Tank Commander code.");
    if (obj.k !== want)
      throw new Error(want === 'a' ? "That's your own invite code. Paste the REPLY code your partner sent back."
                                   : "That's a reply code. Paste the INVITE code the host sent you.");
    if (!sdpLooksSafe(obj.s)) throw new Error('That code failed the safety check, so it was not used.');
    return obj.s;
  }

  // ── safety code (4 symbols from both phones' key fingerprints) ──
  const SYMBOLS = ['🐶','🐱','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🦆','🦉',
                   '🐴','🦄','🐝','🐞','🦋','🐢','🐙','🦀','🐠','🐬','🐳','🌵','🌲','🌻','🌹','🍄',
                   '🌙','⭐','🔥','🌈','⛄','🍎','🍋','🍌','🍉','🍇','🍓','🍒','🍍','🥕','🌽','🍕',
                   '🍔','🍩','🎈','🎁','🎸','🎺','⚽','🏀','🚀','🚗','🚲','⚓','🔑','🔔','💎','👑'];
  async function safetySymbols() {
    const fp = sdp => ((FP_RE.exec(sdp) || [])[1] || '').toUpperCase();
    const text = [fp(net.pc.localDescription.sdp), fp(net.pc.remoteDescription.sdp)].sort().join('|');
    let bytes;
    if (window.crypto && crypto.subtle) bytes = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)));
    else {   // only when not on https (local testing): simple hash fallback
      let h = 2166136261; bytes = [];
      for (let k = 0; k < 4; k++) { for (let i = 0; i < text.length; i++) h = Math.imul(h ^ text.charCodeAt(i), 16777619) >>> 0; bytes.push(h & 255); }
    }
    return [0, 1, 2, 3].map(i => SYMBOLS[bytes[i] & 63]).join('');
  }

  // ── connection setup ──
  function waitForIce(pc) {
    return new Promise(res => {
      if (pc.iceGatheringState === 'complete') return res();
      const t = setTimeout(res, 6000);     // send what we have after 6 s
      pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } });
    });
  }
  function newPeer() {
    const pc = new RTCPeerConnection({ iceServers: STUN });
    pc.addEventListener('connectionstatechange', () => {
      if (pc !== net.pc) return;
      if (pc.connectionState === 'failed') netLost("Couldn't keep the connection. One of the networks may block direct phone-to-phone links — try both phones on home Wi-Fi.");
    });
    return pc;
  }
  function attachChannel(dc) {
    net.dc = dc;
    dc.onopen = onLinkOpen;
    dc.onclose = () => { if (dc === net.dc) netLost('The other player left the game.'); };
    dc.onmessage = e => onNetMessage(e.data);
  }
  function netReset() {
    net.gen++;
    try { if (net.dc) { net.dc.onclose = null; net.dc.close(); } } catch (e) {}
    try { if (net.pc) net.pc.close(); } catch (e) {}
    Object.assign(net, { role: null, pc: null, dc: null, open: false, okSelf: false, okPeer: false,
                         strikes: 0, bucket: 120, playing: false, lastRs: -1, lastState: '' });
    ui.inp.value = ''; ui.out.value = '';
  }
  async function hostStart() {
    netReset();
    const gen = net.gen;
    net.role = 'host';
    coopShow('wait', 'Creating your invite code…');
    try {
      const pc = net.pc = newPeer();
      pc.addEventListener('datachannel', e => e.channel.close());   // only OUR channel is used
      attachChannel(pc.createDataChannel('tc', { ordered: true }));
      await pc.setLocalDescription(await pc.createOffer());
      await waitForIce(pc);
      if (gen !== net.gen) return;
      ui.out.value = await encodeCode('o', pc.localDescription.sdp);
      coopShow('host-invite', '1. Send this INVITE code to your partner (Share → Messages).\n' +
                              '2. When they text back their REPLY code, paste it below and tap Connect.');
    } catch (e) { if (gen === net.gen) coopShow('choose', 'Could not create an invite on this phone: ' + (e.message || e), true); }
  }
  function joinStart() {
    netReset();
    net.role = 'guest';
    coopShow('join-paste', 'Paste the INVITE code the host texted you, then tap "Make reply code".');
  }
  async function onCodeEntered() {
    const gen = net.gen;
    ui.go.disabled = true;
    try {
      if (net.role === 'host') {
        const sdp = await decodeCode(ui.inp.value, 'a');
        if (gen !== net.gen) return;
        coopShow('wait', 'Connecting to your partner…');
        await net.pc.setRemoteDescription({ type: 'answer', sdp });
        connectTimeout(gen);
      } else if (net.role === 'guest') {
        const sdp = await decodeCode(ui.inp.value, 'o');
        if (gen !== net.gen) return;
        coopShow('wait', 'Making your reply code…');
        const pc = net.pc = newPeer();
        pc.addEventListener('datachannel', e => {
          if (net.dc || e.channel.label !== 'tc') { e.channel.close(); return; }   // accept exactly one channel
          attachChannel(e.channel);
        });
        await pc.setRemoteDescription({ type: 'offer', sdp });
        await pc.setLocalDescription(await pc.createAnswer());
        await waitForIce(pc);
        if (gen !== net.gen) return;
        ui.out.value = await encodeCode('a', pc.localDescription.sdp);
        coopShow('join-reply', 'Send this REPLY code back to the host (Share → Messages).\n' +
                               'You\'ll connect as soon as they paste it.');
        connectTimeout(gen, 180000);
      }
    } catch (e) {
      if (gen !== net.gen) return;
      ui.go.disabled = false;
      ui.msg.textContent = e.message || String(e);
      ui.msg.classList.add('err');
    }
  }
  function connectTimeout(gen, ms) {
    setTimeout(() => {
      if (gen === net.gen && !net.open)
        coopShow('choose', "Couldn't connect. Some networks (often mobile data) block direct phone-to-phone links. " +
                           'Try with both phones on home Wi-Fi, and make fresh codes.', true), netReset();
    }, ms || 25000);
  }
  async function onLinkOpen() {
    net.open = true; net.lastRx = performance.now();
    try {
      ui.emoji.textContent = await safetySymbols();
      coopShow('safety', 'Connected! Check that BOTH phones show these same 4 symbols. ' +
                         '(Call or text your partner to compare.)');
    } catch (e) { netLost('Safety check failed: ' + (e.message || e)); }
  }
  function onSafetyMatch() {
    initAudio(); enableTilt();             // inside this tap, so iOS can ask for motion access
    net.okSelf = true;
    netSend({ t: 'ok' });
    if (net.role === 'host') maybeStartCoop();
    else coopShow('wait', 'Waiting for the host to start the battle…');
  }
  function maybeStartCoop() {
    if (net.role !== 'host') return;
    if (!net.okSelf) return;
    if (!net.okPeer) { coopShow('wait', 'Waiting for your partner to confirm the symbols…'); return; }
    startCoopGame();
  }
  function calibrateNow() { if (tilt.active) { needBaseline = true; zeroFlash = 1.6; } }
  function startCoopGame() {
    coopHide();
    calibrateNow();          // the host may have waited a while for the partner; re-zero now
    lives = 3; lives2 = 3; score = 0; player.star = 0;
    ally = makeAlly();
    net.playing = true;
    initLevel(0);
    state = 'play';
  }
  function netLost(why) {
    if (!net.role) return;
    const wasGuest = net.role === 'guest', wasPlaying = net.playing;
    netReset();
    ally = null;
    if (!ui.panel.hidden) { coopShow('choose', why, true); return; }
    if (wasGuest && wasPlaying) { state = 'title'; initLevel(0); }
    showTiltNote(why + (wasGuest ? '' : ' Carry on solo!'));
    setTimeout(() => showTiltNote(''), 6000);
  }

  // ── sending ──
  function netSend(obj) {
    if (!net.dc || net.dc.readyState !== 'open') return;
    try { net.dc.send(JSON.stringify(obj)); net.lastTx = performance.now(); } catch (e) {}
  }
  window.addEventListener('pagehide', () => netSend({ t: 'bye' }));

  // ── receiving: strict checks on everything ──
  const fin = v => typeof v === 'number' && Number.isFinite(v);
  const inRange = (v, lo, hi) => fin(v) && v >= lo && v <= hi;
  const isInt = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;
  const arr = (v, lo, hi) => Array.isArray(v) && v.length >= lo && v.length <= hi;
  function strike() {
    if (++net.strikes > 150) netLost('Your partner\'s phone sent too much unexpected data, so it was disconnected for safety.');
  }
  function onNetMessage(data) {
    if (typeof data !== 'string') return strike();                    // text packets only
    if (data.length > (net.role === 'host' ? 400 : 16000)) return strike();
    // flood guard: refills at 90 packets/s (we send 30/s), burst of 120
    const now = performance.now(), el = (now - (net.lastFill || now)) / 1000;
    net.lastFill = now;
    net.bucket = Math.min(120, net.bucket + el * 90);
    net.strikes = Math.max(0, net.strikes - el * 2);                  // the odd bad packet is forgiven over time
    if (net.bucket < 1) return strike();
    net.bucket -= 1;
    let m;
    try { m = JSON.parse(data); } catch (e) { return strike(); }
    if (!m || typeof m !== 'object' || Array.isArray(m) || typeof m.t !== 'string') return strike();
    net.lastRx = performance.now();
    switch (m.t) {
      case 'hb': return;
      case 'bye': return netLost('The other player left the game.');
      case 'ok':
        if (!net.open) return strike();
        net.okPeer = true;
        if (net.role === 'host') maybeStartCoop();
        return;
      case 'p': if (net.role === 'host') return hostOnPartnerMove(m); return strike();
      case 'f': if (net.role === 'host') return hostOnPartnerFire(m); return strike();
      case 's': if (net.role === 'guest') return guestOnSnapshot(m); return strike();
      default: return strike();
    }
  }

  // ── host side: the partner's tank ──
  function hostOnPartnerMove(m) {
    if (!(inRange(m.x, 0, COLS) && inRange(m.y, 0, ROWS) && inRange(m.a, -7, 7) && inRange(m.u, -7, 7))) return strike();
    if (!ally || !ally.alive || state !== 'play' || !net.okSelf || !net.okPeer) return;
    const now = performance.now();
    const dt = Math.min(1, (now - (ally.lastT || now)) / 1000);
    const moved = Math.hypot(m.x - ally.x, m.y - ally.y);
    // no teleporting, no driving through walls/water, no speeding
    if (moved > MAXV * 1.6 * dt + 0.25 || circleHitsTiles(m.x, m.y, 0.26)) return;   // ignored; the partner's phone gets corrected by the next snapshot
    ally.x = m.x; ally.y = m.y; ally.a = normAng(m.a); ally.t = normAng(m.u);
    ally.tread += moved; ally.lastT = now;
  }
  function hostOnPartnerFire(m) {
    if (!inRange(m.a, -7, 7)) return strike();
    if (!ally || !ally.alive || state !== 'play' || ally.cd > 0) return;   // reload enforced here
    const ca = normAng(m.a);
    const sp = shellSpeed(ally.star);
    shells.push({ x: ally.x + Math.cos(ca) * 0.45, y: ally.y + Math.sin(ca) * 0.45,
                  dx: Math.cos(ca) * sp, dy: Math.sin(ca) * sp, mine: true, pw: ally.star >= 3, owner: null, dead: false });
    ally.cd = reloadTime(ally.star) - 0.05;   // a little slack for network timing
    fxFlash(ally.x + Math.cos(ca) * 0.6, ally.y + Math.sin(ca) * 0.6);
  }
  const TYPE_IDX = { normal: 0, fast: 1, armor: 2 }, IDX_TYPE = ['normal', 'fast', 'armor'];
  function buildSnapshot() {
    const r2 = v => Math.round(v * 100) / 100;
    return {
      t: 's', st: state, lv: level, sc: score, l: [Math.max(0, lives), Math.max(0, lives2)], hq: hqAlive ? 1 : 0,
      q: spawnQueue.length, bt: bonusTank ? 1 : 0, m: map.map(r => r.join('')).join(''),
      p: [r2(player.x), r2(player.y), r2(player.a), r2(player.t), player.hp, player.alive ? 1 : 0],
      g: [r2(ally.x), r2(ally.y), ally.hp, ally.alive ? 1 : 0, Math.min(15, Math.ceil(Math.max(0, ally.inv))), ally.rs, ally.star],
      pu: powerUp ? [r2(powerUp.x), r2(powerUp.y), PU_KINDS.indexOf(powerUp.kind), powerUp.t < 4 ? 1 : 0] : [],
      tm: [Math.min(30, Math.ceil(freezeT)), Math.min(30, Math.ceil(shovelT))],
      e: enemies.filter(e => e.alive).slice(0, 12).map(e =>
           [r2(e.x), r2(e.y), r2(e.ang), TYPE_IDX[e.type], e.hp, e.spawnT > 0 ? 1 : 0, e.flash > 0 ? 1 : 0, e.bonus ? 1 : 0]),
      s: shells.slice(0, 40).map(s => [r2(s.x), r2(s.y), r2(s.dx), r2(s.dy), s.mine ? 1 : 0]),
      v: netEvents.splice(0, 40),
    };
  }

  // ── partner side: apply the host's picture of the battle ──
  const STATES = ['play', 'clear', 'over', 'win'];
  const EV_KINDS = { b: 4, k: 3, x: 4, f: 3, pf: 3, u: 4 };
  function snapshotValid(m) {
    if (!STATES.includes(m.st) || !isInt(m.lv, 0, LEVELS.length - 1) || !isInt(m.sc, 0, 1e8)) return false;
    if (!arr(m.l, 2, 2) || !m.l.every(v => isInt(v, 0, 9)) || !isInt(m.hq, 0, 1) || !isInt(m.q, 0, 30) || !isInt(m.bt, 0, 1)) return false;
    if (typeof m.m !== 'string' || !/^[0-6]{169}$/.test(m.m)) return false;
    if (!arr(m.pu, 0, 4) || (m.pu.length !== 0 && (m.pu.length !== 4 || !inRange(m.pu[0], 0, COLS) || !inRange(m.pu[1], 0, ROWS) ||
        !isInt(m.pu[2], 0, PU_KINDS.length - 1) || !isInt(m.pu[3], 0, 1)))) return false;
    if (!arr(m.tm, 2, 2) || !m.tm.every(v => isInt(v, 0, 30))) return false;
    const P = m.p, G = m.g;
    if (!arr(P, 6, 6) || !inRange(P[0], 0, COLS) || !inRange(P[1], 0, ROWS) || !inRange(P[2], -7, 7) || !inRange(P[3], -7, 7) ||
        !isInt(P[4], 0, 3) || !isInt(P[5], 0, 1)) return false;
    if (!arr(G, 7, 7) || !inRange(G[0], 0, COLS) || !inRange(G[1], 0, ROWS) || !isInt(G[2], 0, 3) || !isInt(G[3], 0, 1) ||
        !isInt(G[4], 0, 15) || !isInt(G[5], 0, 1e6) || !isInt(G[6], 0, 3)) return false;
    if (!arr(m.e, 0, 12) || !m.e.every(e => arr(e, 8, 8) && isInt(e[7], 0, 1) && inRange(e[0], 0, COLS) && inRange(e[1], 0, ROWS) && inRange(e[2], -7, 7) &&
        isInt(e[3], 0, 2) && isInt(e[4], 0, 3) && isInt(e[5], 0, 1) && isInt(e[6], 0, 1))) return false;
    if (!arr(m.s, 0, 40) || !m.s.every(s => arr(s, 5, 5) && inRange(s[0], -1, COLS + 1) && inRange(s[1], -1, ROWS + 1) &&
        inRange(s[2], -16, 16) && inRange(s[3], -16, 16) && isInt(s[4], 0, 1))) return false;
    if (!arr(m.v, 0, 40) || !m.v.every(v => arr(v, 1, 4) && typeof v[0] === 'string' && EV_KINDS[v[0]] === v.length &&
        inRange(v[1], -1, COLS + 1) && inRange(v[2], -1, ROWS + 1) && (v.length < 4 || isInt(v[3], 0, v[0] === 'u' ? PU_KINDS.length - 1 : 1)))) return false;
    return true;
  }
  function guestOnSnapshot(m) {
    if (!net.okSelf) return;
    if (!snapshotValid(m)) return strike();
    if (!ui.panel.hidden) coopHide();
    if (!net.playing || (m.st === 'play' && state !== 'play' && state !== 'clear')) calibrateNow();   // battle (re)starts: re-zero tilt
    net.playing = true;
    const prevState = state;
    if (m.lv !== level || prevState === 'title' || prevState === 'over' || prevState === 'win') {
      if (m.st === 'play') { level = m.lv; hintT = level === 0 ? 7 : 3; resetPlayer(); }
    }
    level = m.lv;
    // map (validated: exactly 169 digits 0-5)
    for (let i = 0; i < 169; i++) map[(i / COLS) | 0][i % COLS] = m.m.charCodeAt(i) - 48;
    state = m.st;
    if (state !== prevState) {
      stateT = 0;
      const okSound = performance.now() - (net.stateSfxAt || 0) > 1500;   // no jingle spam
      if (okSound) net.stateSfxAt = performance.now();
      if (state === 'clear') { if (okSound) sfx.clear(); bonusTank = !!m.bt; }
      if (state === 'over' && okSound) sfx.lose();
    }
    score = m.sc; lives = m.l[1]; lives2 = m.l[0]; hqAlive = !!m.hq; guestQueue = m.q;
    // the host's tank
    if (!ally) ally = makeAlly();
    const P = m.p;
    ally.tread += Math.hypot(P[0] - ally.x, P[1] - ally.y);
    Object.assign(ally, { x: P[0], y: P[1], a: P[2], t: P[3], hp: P[4], alive: !!P[5] });
    // our own tank: health / respawns come from the host
    const G = m.g;
    if (G[5] !== net.lastRs) {                       // host respawned us (or new stage)
      if (net.lastRs !== -1) resetPlayer();
      net.lastRs = G[5];
    }
    if (G[2] < player.hp && G[3]) { hurt = 0.5; shake = 1.2; sfx.hit(); haptic('hit'); }
    player.hp = G[2]; player.alive = !!G[3]; player.star = G[6];
    if (Math.abs(G[4] - player.inv) > 1) player.inv = G[4];                       // shield time from the host
    powerUp = m.pu.length ? { x: m.pu[0], y: m.pu[1], kind: PU_KINDS[m.pu[2]], t: m.pu[3] ? 2 : 10 } : null;
    freezeT = m.tm[0]; shovelT = m.tm[1];
    if (player.alive && Math.hypot(G[0] - player.x, G[1] - player.y) > 1.2) {
      player.x = G[0]; player.y = G[1];               // host corrected our position
    }
    // enemies and shells
    enemies = m.e.map(e => ({ x: e[0], y: e[1], ang: e[2], type: IDX_TYPE[e[3]], hp: e[4], spawnT: e[5] ? 1 : 0, bonus: !!e[7],
                              flash: e[6] ? 0.1 : 0, alive: true, tread: e[0] + e[1] }));
    shells = m.s.map(s => ({ x: s[0], y: s[1], dx: s[2], dy: s[3], mine: !!s[4] }));
    // effects (rate-capped: at most ~20 sounds/s and 150 live effects, whatever the host sends)
    const nowS = performance.now() / 1000;
    net.sfxBudget = Math.min(20, (net.sfxBudget ?? 20) + (nowS - (net.sfxAt || nowS)) * 20);
    net.sfxAt = nowS;
    for (const v of m.v) {
      if (fx.length > 150 || net.sfxBudget < 1) break;
      net.sfxBudget -= 1;
      const [k, x, y, z] = v;
      if (k === 'b') { fx.push({ kind: 'boom', x, y, t: 0, dur: z ? 1.1 : 0.5, big: !!z }); sfx.boom(!!z); }
      else if (k === 'k') { fx.push({ kind: 'boom', x, y, t: 0, dur: 0.5, big: false }); sfx.brick(); }
      else if (k === 'x') { fx.push({ kind: 'spark', x, y, t: 0, dur: 0.3 }); if (z && distTo(x, y) < 6) sfx.clang(); }
      else if (k === 'f' || k === 'pf') { fx.push({ kind: 'flash', x, y, t: 0, dur: 0.12 }); sfx.enemyFire(distTo(x, y)); }
      else if (k === 'u') { popup = { text: PU_TEXT[z], t: 1.8 }; sfx.powerup(); }
    }
  }
  let guestQueue = 0;
  function guestUpdate(dt) {
    if (state === 'play') { if (hintT > 0) hintT -= dt; updatePlayer(dt); }
    else { player.L = player.R = 0; stateT += dt; }
    for (const s of shells) { s.x += s.dx * dt; s.y += s.dy * dt; }   // smooth between snapshots
    if (player.inv > 0) player.inv -= dt;
    if (popup) popup.t -= dt;
    if (powerUp) powerUp.t -= dt;
  }
  // per-frame network chores (called from the main loop)
  function netTick(dt) {
    if (!net.role) return;
    if (!net.open) return;
    net.sendAcc += dt;
    if (net.sendAcc < 1 / 30) return;
    net.sendAcc = 0;
    if (net.role === 'host' && net.playing && ally) netSend(buildSnapshot());
    else if (net.role === 'guest' && net.playing && state === 'play' && player.alive)
      netSend({ t: 'p', x: r3(player.x), y: r3(player.y), a: r3(player.a), u: r3(player.t) });
  }
  // "still here" signal + lost-contact check on their own timer, so they keep going even
  // when the animation loop is paused (screen dimmed, app briefly in the background)
  setInterval(() => {
    if (!net.role || !net.open) return;
    const now = performance.now();
    if (now - net.lastTx > 900) netSend({ t: 'hb' });
    if (now - net.lastRx > 15000) netLost('Lost contact with your partner.');
  }, 1000);

  // ── buttons ──
  let framed = false;
  try { framed = window.top !== window.self; } catch (e) { framed = true; }
  coopEl('mCoop').addEventListener('click', () => {
    if (framed) { showTiltNote('For safety, 2-player co-op only works when the game is opened directly, not inside another website.'); return; }
    initAudio(); netReset(); coopShow('choose',
    'Play together on two phones, anywhere — even in different cities.\n' +
    'One of you HOSTS, the other JOINS. You\'ll swap two codes by text message.'); });
  coopEl('cHost').addEventListener('click', hostStart);
  coopEl('cJoin').addEventListener('click', joinStart);
  coopEl('cGo').addEventListener('click', onCodeEntered);
  coopEl('cCancel').addEventListener('click', () => { netSend({ t: 'bye' }); netReset(); ally = null; coopHide(); });
  coopEl('cMatch').addEventListener('click', onSafetyMatch);
  coopEl('cNoMatch').addEventListener('click', () => {
    netSend({ t: 'bye' }); netReset();
    coopShow('choose', 'Disconnected. Different symbols can mean the codes were changed on the way. ' +
                       'Start again with fresh codes, sent directly to each other.', true);
  });
  coopEl('cCopy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(ui.out.value); coopEl('cCopy').textContent = 'Copied ✓'; }
    catch (e) { ui.out.focus(); ui.out.select(); coopEl('cCopy').textContent = 'Select & copy'; }
    setTimeout(() => { coopEl('cCopy').textContent = 'Copy'; }, 2000);
  });
  coopEl('cShare').addEventListener('click', async () => {
    if (navigator.share) { try { await navigator.share({ text: ui.out.value }); } catch (e) {} }
    else coopEl('cCopy').click();
  });
  coopEl('mSolo').addEventListener('click', () => beginPlay(0));
  coopEl('mCont').addEventListener('click', () => beginPlay(savedStage()));


  // ── Main loop ────────────────────────────────────────────────────────────
  initLevel(0);
  let last = performance.now();
  function loop(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    netTick(dt);
    updateAudio(dt);
    render();
    const playingNow = state === 'play' || state === 'clear';
    if (!playingNow && document.body.classList.contains('playing')) releaseAllControls();
    document.body.classList.toggle('playing', playingNow);
    const onTitle = state === 'title' && ui.panel.hidden;
    if (onTitle && !document.body.classList.contains('title')) {
      const st = savedStage();
      document.getElementById('mCont').hidden = st === 0;
      document.getElementById('mContN').textContent = String(st + 1);
    }
    document.body.classList.toggle('title', onTitle);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // Test hook for automated checks — only on local development copies, never on the live site
  if (location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') window.__tank = {
    player, keys, tiltSim,
    get state() { return state; }, get enemies() { return enemies; }, get shells() { return shells; },
    get map() { return map; }, get level() { return level; }, get score() { return score; }, get lives() { return lives; },
    get tilt() { return tilt; }, owed, payOwedBuzz, get baseline() { return baseline; }, get side() { return side; },
    start: beginPlay, setLevel(i) { initLevel(i); state = 'play'; },
    net, get ally() { return ally; }, decodeCode, encodeCode, snapshotValid, buildSnapshot, onNetMessage,
    get powerUp() { return powerUp; }, set powerUp(v) { powerUp = v; }, get freezeT() { return freezeT; }, get shovelT() { return shovelT; },
    tick(dt, n) { for (let i = 0; i < (n || 1); i++) { update(dt || 1 / 30); netTick(dt || 1 / 30); } },
    step(dt, n) { for (let i = 0; i < (n || 1); i++) update(dt || 1 / 60); render(); },
    readTreads,
  };
})();
</script>
